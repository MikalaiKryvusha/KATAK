<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KATAK — калькулятор турбины Архимеда</title>
<style>
/* Layout: desktop first — a procedure sheet like the KEINKT Calibrator (researches/03 §1): a header with the language at the
   top right, an intro with fact cards, a step navigation, then steps as bands — inputs on the left, what they give on the
   right; one column on a phone. Palette: the classic Krinik acid pink on near-black (GOAL.md). [NOT-TESTED] */
:root {
  --bg: #0D0D0D; --surface: #171217; --surface2: #1F161D; --ink: #F4EEF2; --muted: #A99AA3; --rule: #3A2633;
  --accent: #FF1A8C; --accent2: #FF5FB0; --accent-ink: #FFFFFF; --glow: #2A0A1C;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #FF6B6B;
  --display: "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif; --body: "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(1200px 600px at 70% -10%, #2A0A1C 0%, var(--bg) 60%) fixed, var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px max(24px, env(safe-area-inset-left)) 64px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 40px; } h2 { font-size: 24px; } h3 { font-size: 16px; }
p { margin: 0; max-width: 70ch; }
a { color: var(--accent2); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand .logo { width: 64px; height: 64px; flex: none; filter: drop-shadow(0 0 12px rgba(255, 26, 140, .45)); }
.mark { font: 700 14px var(--display); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.lang { display: flex; align-items: center; gap: 8px; }
.lang select, .field select, .field input { font: 15px var(--body); padding: 8px 10px; border: 1px solid var(--rule); background: var(--surface2); color: var(--ink); border-radius: 8px; width: 100%; }
.lang select { width: auto; min-width: 150px; font-weight: 600; cursor: pointer; }
.field input:focus, .field select:focus, .lang select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* the intro: the lede across the full width, the three fact cards in one row under it (owner 2026-11-16 16:51 «дыру убрать,
   туда поместить в ряд карточки, текст вверху широко») */
.intro { display: flex; flex-direction: column; gap: 16px; }
.lede { font-size: 18px; color: var(--ink); max-width: none; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fact { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--muted); }
.fact b { display: block; color: var(--ink); font-family: var(--display); margin-bottom: 2px; }
.steps-nav { display: flex; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--surface); position: sticky; top: 8px; z-index: 5; }
.steps-nav a { flex: 1; padding: 10px 14px; text-decoration: none; color: var(--ink); font-size: 14px; border-right: 1px solid var(--rule); display: flex; gap: 8px; align-items: baseline; }
.steps-nav a:last-child { border-right: 0; }
.steps-nav a b { color: var(--accent); }
.steps-nav a:hover { background: var(--surface2); }
.step { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 24px; display: grid; grid-template-columns: 44px minmax(0, 6fr) minmax(0, 5fr); gap: 16px 24px; scroll-margin-top: 64px; }
.step > .n { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 18px var(--display); box-shadow: 0 0 16px rgba(255, 26, 140, .5); }
.step .text { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.step .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; color: var(--muted); font-size: 14px; }
.step.wide .side { grid-column: 2 / -1; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.field label { color: var(--ink); font-weight: 600; }
.field .hint { color: var(--muted); font-size: 12.5px; }
.field .unit { color: var(--muted); font-weight: 400; }
.field.auto input::placeholder { color: var(--accent2); opacity: .9; }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--body); padding: 11px 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 0 14px rgba(255, 26, 140, .35); }
.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); box-shadow: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface2); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font: 700 24px var(--display); color: var(--ink); }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.kpi .l { font-size: 12.5px; color: var(--muted); }
.kpi.hero { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 18px rgba(255, 26, 140, .25); }
.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.chart { width: 100%; height: auto; background: var(--surface2); border: 1px solid var(--rule); border-radius: 12px; }
.chart text { fill: var(--muted); font: 11px var(--body); }
.chart .hit { cursor: crosshair; }
.chart .tip-box { fill: #1F161D; stroke: var(--accent); }
.chart .tip text { fill: var(--ink); font-size: 12px; }
table.spec { width: 100%; border-collapse: collapse; font-size: 14px; }
table.spec td { padding: 6px 4px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.spec td:last-child { text-align: right; font-family: var(--mono); color: var(--ink); white-space: nowrap; }
table.spec td:first-child { color: var(--muted); }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.notes li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; color: var(--ink); }
.notes li::before { font-weight: 700; }
.notes li.ok::before { content: "✓"; color: var(--ok); }
.notes li.warn::before { content: "!"; color: var(--warn); }
.notes li.bad::before { content: "✕"; color: var(--bad); }
.viewer { position: relative; }
.viewer canvas { width: 100%; height: 520px; display: block; border-radius: 12px; border: 1px solid var(--rule); background: radial-gradient(circle at 50% 40%, #2A0A1C, #0D0D0D 70%); cursor: grab; touch-action: none; }
.viewer .cap { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
.note { font-size: 13px; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--rule); padding-top: 16px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  h1 { font-size: 28px; }
  .wrap { padding: 18px 16px 48px; }
  .top { flex-direction: column; align-items: flex-start; }
  .facts, .grid { grid-template-columns: 1fr; }
  .steps-nav { display: none; }
  .step { grid-template-columns: 1fr; padding: 16px; }
  .step.wide .side { grid-column: auto; }
  .viewer canvas { height: 360px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<script type="module">
// ===== CORE-BEGIN (pure functions, no DOM; tested by kalculator/test.mjs) =====
// The KATAK core: geometry of the printable turbine and the binary STL. Units: millimetres in geometry (the STL boundary),
// SI in physics (phase B). Every non-trivial block carries its test status (TESTING_FRAMEWORK.md markers).
const KATAK = (() => {
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- vectors
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const unit = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  // ---------------------------------------------------------------- mesh
  // A mesh is { v: [[x,y,z]…], f: [[a,b,c]…] } — one or more CLOSED shells. Shells may overlap: slicers union closed shells
  // (risk (a) of plans/01 — proven by slicing in the run report). [NOT-TESTED]
  const mesh = () => ({ v: [], f: [] });
  function append(dst, src) {
    const o = dst.v.length;
    for (const p of src.v) dst.v.push(p);
    for (const [a, b, c] of src.f) dst.f.push([a + o, b + o, c + o]);
    return dst;
  }
  function signedVolume(m) { let s = 0; for (const [a, b, c] of m.f) s += dot(m.v[a], cross(m.v[b], m.v[c])); return s / 6; }
  // flip a whole shell when it came out inside-out (its signed volume is negative) — shells are built consistently, so
  // one global decision per shell suffices
  function orientOutward(m) { if (signedVolume(m) < 0) for (const f of m.f) { const t = f[1]; f[1] = f[2]; f[2] = t; } return m; }
  // Closedness (2-manifold, consistently oriented): every directed edge a→b occurs once and its reverse b→a occurs once.
  function checkClosed(m) {
    const seen = new Map();
    for (const [a, b, c] of m.f) for (const [p, q] of [[a, b], [b, c], [c, a]]) {
      const k = p + ',' + q; seen.set(k, (seen.get(k) || 0) + 1);
    }
    let open = 0, doubled = 0;
    for (const [k, n] of seen) {
      if (n > 1) doubled++;

  // ---------------------------------------------------------------- shells

  // direction the top faces use, so the sides come out consistent (derivation in the commit of this block). [NOT-TESTED]
  function gridSolid(top, bot) {

      m.f.push([ib(i, j), ib(i + 1, j + 1), ib(i + 1, j)], [ib(i, j), ib(i, j + 1), ib(i + 1, j + 1)]);

  // Profiles of the shaft / bore: the boundary point at polar angle a — every profile sampled at the SAME angles, so an outer
  // and an inner profile pair up vertex by vertex. kinds: round (size = diameter), hex (size = across flats), square (size =

    if (kind === 'square') { const ap = r, seg = TAU / 4, x = ((a % seg) + seg) % seg - seg / 2; return ap / Math.cos(x); }

  // A prism of a profile from z0 to z1, optionally with a profiled hole through it. [NOT-TESTED]
  function prism(outerKind, outerSize, z0, z1, n, holeKind = null, holeSize = 0) {
    const m = mesh();

    const at = (arr) => { const o = m.v.length; for (const p of arr) m.v.push(p); return o; };

    if (holeKind) {

        m.f.push([OT + i, OT + j, IT + j], [OT + i, IT + j, IT + i]);                 // top annulus
        m.f.push([OB + i, IB + j, OB + j], [OB + i, IB + i, IB + j]);                 // bottom annulus

  }

  // A solid of revolution about z from a profile [[r, z]…]: either from pole to pole (first and last r = 0) or a closed loop

  function revolve(profile, n) {

    return orientOutward(m);
  }

  // A round tube swept along a polyline (ribs) or a closed loop (the rim ring); frames by parallel transport. [NOT-TESTED]
  function sweepTube(path, radius, n, closedLoop = false) {
    const m = mesh(), N = path.length;

    let nrm = unit(cross(tan[0], Math.abs(tan[0][2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));

      const bin = cross(tan[i], nrm), o = m.v.length; rings.push(o);

    }

      const A = rings[0], B = rings[N - 1];

      // the same way round, and every rib came out open (kalculator/test.mjs: open 144 = 9 ribs × 8 × 2 caps)
      for (let k = 0; k < n; k++) { const l = (k + 1) % n; m.f.push([c0, A + k, A + l], [c1, B + l, B + k]); }

  // ---------------------------------------------------------------- printing (researches/02_3d_printing)

    const h = layer_mm || Math.round(0.5 * nozzle_mm / 0.02) * 0.02;   // 50 % of the nozzle (researches/02 §4)

  }

  // The hub: a round tube along the axis. bore = 'bearings' → a round bore with a bearing seat at each end (press fit);

  function hub(p, d, det) {

  // Ties between neighbouring turns (§5.8, §6.6): in the meridional half-plane θ_p the blades cross as segments (one per

  // The nose fairing (§6.8, ideas/01, ideas/04): a solid of revolution that sits ON THE AXLE in front of the front bearing

  // отдалении в 10...100 мм»). Profile: tip → outer dome → flat base → blind bore for the axle end → bore bottom (a pole).

  // Exit ring (§5.8 p. 3): a round tube through the three exit edges at z = L_s, radius R.

    const loop = [];
    for (let i = 0; i < det.round * 2; i++) { const a = TAU * i / (det.round * 2); loop.push([d.R * Math.cos(a), d.R * Math.sin(a), d.Ls]); }
    return sweepTube(loop, p.rim_mm / 2, Math.max(8, det.round / 4), true);
  }

  // Detail as a percentage 10–100 % (owner 2026-11-16 16:29: «в процентах задавать, с шагом 10%»): linear between the
  // «low» and «ultra» sampling counts; a named level is still accepted (the tools and the tests use them). [NOT-TESTED]
  function detailOf(v) {
    if (typeof v !== 'number') return DETAIL[v] || DETAIL.medium;
    const t = (Math.min(100, Math.max(10, v)) - 10) / 90, lo = DETAIL.low, hi = DETAIL.ultra, L = (a, b) => Math.round(a + (b - a) * t);
    return { along: L(lo.along, hi.along), across: L(lo.across, hi.across), round: Math.round(L(lo.round, hi.round) / 4) * 4 };
  }
  // Resolve the derived defaults (wall, hub), then build every printable part — meshes in mm, each standing on the bed.
  function resolve(input = {}) {
    const p = { ...DEFAULTS, ...input };
    const wanted = p.wall_mm ?? Math.max(0.008 * p.diameter_mm, 3 * (p.line_mm || 1.125 * p.nozzle_mm));
    const wf = wallForNozzle({ nozzle_mm: p.nozzle_mm, layer_mm: p.layer_mm, line_mm: p.line_mm, wanted_mm: wanted });
    if (p.hub_od_mm == null) p.hub_od_mm = Math.max(p.hub_ratio * p.diameter_mm, (p.bore === 'bearings' ? p.bearing_od_mm : p.bore_mm) + 2 * wf.T(3));
    // L/D: the rule's 0.9 (§7), raised when the blades would pass closer than 3 walls at the smallest opening angle
    // (§6.2 check 2: g = (L_s − (R − r_h)·cot α_min)/(N·n_t) · sin α_min ≥ 3t). First run: 0.9 gave 6.0 mm for 3t = 7.5 mm.
    if (p.ld == null) {
      const aMin = Math.min(...(p.angle_mode === 'variable' ? [p.a1_deg, p.a2_deg, p.a3_deg] : [p.alpha_deg])) * Math.PI / 180;
      const R = p.diameter_mm / 2, rh = p.hub_od_mm / 2;
      const need = ((R - rh) / Math.tan(aMin) + 3 * wf.wall_mm * p.blades * p.turns / Math.sin(aMin)) / p.diameter_mm;

  }
  function build(input = {}) {
    const { p, wf } = resolve(input);
    const det = detailOf(p.detail), wall = wf.wall_mm, d = dims(p, wall);
    const rotor = mesh();
    for (let k = 0; k < p.blades; k++) append(rotor, blade(p, d, k, wall, det));
    append(rotor, hub(p, d, det));
    for (const t of ties(p, d, wall, det)) append(rotor, t);
    if (p.rim) append(rotor, rim(p, d, det));
    const lo = bounds(rotor).lo; translate(rotor, [0, 0, -lo[2]]);
    const parts = { rotor };
    let noseInfo = null;
    if (p.nose) { noseInfo = nose(p, d, det); parts.nose = noseInfo.mesh; }
    return { params: p, wall: wf, dims: d, checks: checks(p, d, wall), nose: noseInfo && { length_mm: noseInfo.length_mm, base_mm: noseInfo.base_mm }, parts, lift_mm: -lo[2] };
  }

  // ---------------------------------------------------------------- the print from parts (epic 02, phase 1)
  // The computed rotor cut into core floors (planes across the axis) and skirts (outside r_cut in the top view): every part a
  // closed mesh that fits the bed; all parts assemble along the axis from the nose, back to front (researches/07 §3–§4).
  // Phase 1 — butt seams; the dovetail comb is phase 2. Ties and the exit rim are not built in this mode. [NOT-TESTED]
  const SPLIT_MARGIN_MM = 5;
  function clipSlab(poly, za, zb) {                         // a closed (r, z) polygon clipped to za ≤ z ≤ zb (Sutherland–Hodgman)
    const pass = (pts, inside, at) => { const out = []; for (let i = 0; i < pts.length; i++) { const A = pts[i], B = pts[(i + 1) % pts.length];
      const ia = inside(A), ib = inside(B); if (ia) out.push(A); if (ia !== ib) out.push(at(A, B)); } return out; };
    const cut = (z) => (A, B) => { const t = (z - A[1]) / (B[1] - A[1]); return [A[0] + t * (B[0] - A[0]), z]; };
    return pass(pass(poly, (P) => P[1] >= za - 1e-9, cut(za)), (P) => P[1] <= zb + 1e-9, cut(zb));
  }
  function hubPart(p, d, det, za, zb) {
    const R = d.rh;
    if (p.bore === 'solid') return prism(p.bore_kind, 2 * R, za, zb, det.round);
    if (p.bore === 'profile') return prism('round', 2 * R, za, zb, det.round, p.bore_kind, p.bore_mm + p.fit_mm);
    const z0 = -p.hub_front_mm, z1 = d.Ls + p.hub_back_mm, rb = (p.bore_mm + 1.0) / 2, rs = (p.bearing_od_mm - p.fit_mm) / 2, w = p.bearing_w_mm;
    return revolve(clipSlab([[R, z0], [R, z1], [rs, z1], [rs, z1 - w], [rb, z1 - w], [rb, z0 + w], [rs, z0 + w], [rs, z0]], za, zb), det.round);
  }
  // a part stands on z = 0; a skirt is also turned about the axis to its smallest footprint and centred
  function place(m, turn) {
    if (turn) {
      let best = null;
      for (let a = 0; a < 180; a += 1) { const c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180);
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (const q of m.v) { const X = q[0] * c + q[1] * s, Y = -q[0] * s + q[1] * c; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); }
        const big = Math.max(x1 - x0, y1 - y0); if (!best || big < best.big) best = { big, a }; }
      const c = Math.cos(best.a * Math.PI / 180), s = Math.sin(best.a * Math.PI / 180);

    }

  }
  // the share of skirt points that another blade covers in front (smaller z) at the same angle and radius — such a point
  // cannot arrive by a straight move along the axis from the nose (researches/07 §3)
  function assemblyBlocked(p, d, rCut, uc) {
    const ro = (u) => d.rh + (d.R - d.rh) * Math.pow(u, p.p_exp);
    const zAt = (u, r) => { const zo = d.Ls * Math.pow(u, p.q_exp), zh = zo - (ro(u) - d.rh) / Math.tan(alphaAt(p, u)); return zh + (r - d.rh) / Math.max(1e-9, ro(u) - d.rh) * (zo - zh); };
    let n = 0, blocked = 0;
    for (let i = 0; i <= 120; i++) { const u = uc + (1 - uc) * i / 120;
      for (let j = 0; j <= 12; j++) { const r = rCut + (ro(u) - rCut) * j / 12, z = zAt(u, r); n++;
        for (let m = 1; m < p.blades * p.turns * 2 + 1; m++) { const u2 = u - m / (p.blades * p.turns); if (u2 < d.u0) break; if (r <= ro(u2) && zAt(u2, r) < z) { blocked++; break; } } } }
    return n ? blocked / n : 0;
  }
  // opts.place = false keeps every part where it sits in the rotor (the tests check seams and the assembly path there)
  function split(input = {}, bed = { xy: 220, z: 250 }, opts = {}) {
    const { p, wf } = resolve(input);
    const det = detailOf(p.detail), wall = wf.wall_mm, d = dims(p, wall), rRoot = d.rh - wall / 2;
    const z0 = -p.hub_front_mm, z1 = d.Ls + p.hub_back_mm, H = z1 - z0, floors = Math.max(1, Math.ceil(H / bed.z));
    const seat = p.bore === 'bearings' ? p.bearing_w_mm + 1 : 0;   // a floor plane never cuts a bearing seat
    const planes = [-Infinity, ...Array.from({ length: floors - 1 }, (_, i) => Math.min(z1 - seat, Math.max(z0 + seat, z0 + H * (i + 1) / floors))), Infinity];
    const ro = (u) => d.rh + (d.R - d.rh) * Math.pow(u, p.p_exp);
    const vR = (rc) => (u) => (rc - rRoot) / (ro(u) - rRoot);   // v of the radius rc along the generator (> 1: the edge is inside)
    const vZ = (u, z) => {                                  // v of the height z along the generator (z is linear in v)
      if (!Number.isFinite(z)) return z;
      const zo = d.Ls * Math.pow(u, p.q_exp), zh = zo - (ro(u) - d.rh) / Math.tan(alphaAt(p, u));
      return (z - zh) / ((zo - zh) * (ro(u) - rRoot) / Math.max(1e-9, ro(u) - d.rh));
    };
    // the boundaries are set on the blade's middle surface and the sheet is offset along its normal, so its two faces cross a
    // plane / a cylinder at different places: the vertices are clamped onto the plane (bugs/03 — a floor stands on its hub)
    // and onto the cylinder r = r_cut (bugs/04 — the seam is vertical, a move along the axis slides along it)
    const clampZ = (m, za, zb) => { for (const q of m.v) q[2] = Math.min(zb, Math.max(za, q[2])); return m; };
    const clampR = (m, rc, outside) => { for (const q of m.v) { const r = Math.hypot(q[0], q[1]); if (r < 1e-9) continue;
      const t = outside ? Math.max(r, rc) : Math.min(r, rc); if (t !== r) { q[0] *= t / r; q[1] *= t / r; } } return m; };
    const buildFloors = (rc) => planes.slice(0, -1).map((za, i) => {
      const zb = planes[i + 1], m = mesh();
      for (let k = 0; k < p.blades; k++) {
        const bl = clampZ(blade(p, d, k, wall, det, { ua: d.u0, ub: 1, lo: (u) => vZ(u, za), hi: (u) => Math.min(vR(rc)(u), vZ(u, zb)) }), za, zb);
        append(m, Number.isFinite(rc) ? clampR(bl, rc, false) : bl);

    let rCut = Infinity, parts = buildFloors(rCut);

    const uc = Number.isFinite(rCut) ? Math.min(1, Math.max(d.u0, Math.pow(Math.max(0, (rCut - d.rh) / (d.R - d.rh)), 1 / p.p_exp))) : 1;
    if (uc < 1) parts.push({ id: 'skirt', kind: 'skirt', count: p.blades, mesh: clampR(blade(p, d, 0, wall, det, { ua: uc, ub: 1, lo: vR(rCut), hi: () => 1 }), rCut, true) });
    for (const part of parts) { if (opts.place !== false) place(part.mesh, part.kind === 'skirt'); part.size = bounds(part.mesh).size; }
    const fits = parts.every((q) => q.size[0] <= bed.xy && q.size[1] <= bed.xy && q.size[2] <= bed.z);
    return { parts, floors, rCut, total: parts.reduce((s, q) => s + q.count, 0), wrap_deg: uc < 1 ? 360 * p.turns * (1 - uc) : 0,
      blocked: uc < 1 ? assemblyBlocked(p, d, rCut, uc) : 0, fits, params: p };
  }

  // Side view for the page's rotor diagram (ideas/04): the blade edges projected on the plane through the axis (z along,
  // x across), the side flagged by y (front / back), the outer envelope, the hub and the main dimensions — from the SAME
  // geometry that writes the STL. [NOT-TESTED]
  function sideView(input = {}) {

    for (let k = 0; k < p.blades; k++) {
      const pts = [];
      for (let i = 0; i <= n; i++) { const u = d.u0 + (1 - d.u0) * i / n, P = bladeSurface(p, d, k, u, 1); pts.push([P[2], P[0], P[1] >= 0]); }
      edges.push(pts);
    }
    const env = [];
    for (let i = 0; i <= n; i++) { const u = d.u0 + (1 - d.u0) * i / n; env.push([d.Ls * Math.pow(u, p.q_exp), d.rh + (d.R - d.rh) * Math.pow(u, p.p_exp)]); }
    return { p, wall: wf, R: d.R, Ls: d.Ls, rh: d.rh, edges, env, hubFront: p.hub_front_mm, hubBack: p.hub_back_mm };
  }

  // ---------------------------------------------------------------- physics (researches/01 §2–§5, SI units)
  // Every constant names its section; [ОЦЕНКА] there = an engineering estimate of the recon, shown to the user as such.
  const RD = 287.05;                                        // J/(kg·K), §3.1
  const NU_AIR = 1.5e-5;                                    // m²/s, §2.4 (Re_D)
  const CP_PRESETS = {                                      // §2.4 «Наборы параметров»
    realistic: { cp: 0.22, lam: 1.8 }, optimistic: { cp: 0.29, lam: 2.1 }, pessimistic: { cp: 0.12, lam: 1.2 },
  };
  const TERRAIN = {                                         // §3.2, z0 (m) per WMO class
    sea: 0.0002, snow: 0.005, open: 0.03, crops: 0.10, scattered: 0.25, park: 0.5, suburb: 1.0, city: 2.0,
  };
  const SITE = { field: 1.0, rural: 0.85, roof_high: 0.6, roof: 0.3, yard: 0.1 };   // §3.5 f_site [ОЦЕНКА]
  const MATERIALS = {                                       // §5.6: ρ g/cm³, σ_Z MPa (across layers — the weak one), HDT °C, outdoor
    ASA: { rho: 1.05, sz: 35, hdt: 100, outdoor: true }, PETG: { rho: 1.25, sz: 39, hdt: 69, outdoor: true },
    ABS: { rho: 1.05, sz: 32, hdt: 87, outdoor: false }, PLA: { rho: 1.24, sz: 35, hdt: 57, outdoor: false },
    PACF: { rho: 1.06, sz: 64, hdt: 194, outdoor: true },
  };
  const BEARINGS = [                                        // deep-groove ball bearings: bore, OD, width (mm) — catalogue sizes
    { id: '608', d: 8, D: 22, B: 7 }, { id: '6000', d: 10, D: 26, B: 8 }, { id: '6001', d: 12, D: 28, B: 8 },
    { id: '6002', d: 15, D: 32, B: 9 }, { id: '6003', d: 17, D: 35, B: 10 }, { id: '6004', d: 20, D: 42, B: 12 },
    { id: '6005', d: 25, D: 47, B: 12 },
  ];
  // Γ(x), Lanczos approximation (g = 7) — for the Weibull scale c = V̄/Γ(1 + 1/k), §3.3
  function gamma(x) {
    const g = 7, C = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
      12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));

    for (let i = 1; i < 9; i++) a += C[i] / (x + i);
    return Math.sqrt(2 * Math.PI) * Math.pow(t, x + 0.5) * Math.exp(-t) * a;
  }
  // ISA density with the user's temperature, §3.1: p(h) = 101325·(1 − 0.0065h/288.15)^5.25588, ρ = p/(R_d·T)
  const density = (alt_m, t_c) => 101325 * Math.pow(1 - 0.0065 * alt_m / 288.15, 5.25588) / (RD * (t_c + 273.15));
  // log wind profile, §3.2 (displacement d = 0 for a free mast)
  const windAt = (vRef, zRef, z, z0) => vRef * Math.log(Math.max(z, z0 * 1.01) / z0) / Math.log(zRef / z0);
  const weibullC = (vMean, k) => vMean / gamma(1 + 1 / k);
  const weibullPdf = (v, c, k) => (v <= 0 ? 0 : (k / c) * Math.pow(v / c, k - 1) * Math.exp(-Math.pow(v / c, k)));
  const interp = (x, x0, x1, y0, y1) => y0 + (y1 - y0) * Math.max(0, Math.min(1, (x - x0) / (x1 - x0)));

  // Cp_max and λ_opt of THIS geometry: the preset times the multipliers of §2.4 (exit angle, variable profile, blade count,
  // thickness, Reynolds number, tower). Returns the parts so the page can show where a number came from.
  function rotorModel(p, wall_mm, vHubMean) {
    const pre = CP_PRESETS[p.cp_preset] || CP_PRESETS.realistic;
    const aExit = p.angle_mode === 'variable' ? p.a3_deg : p.alpha_deg;
    const fA = Math.max(0.5, 1 - 0.29 * Math.pow((aExit - 60) / 30, 2));
    const fVar = p.angle_mode === 'variable' ? 1.10 : 1.0;
    const fN = { 2: 0.97, 3: 1.0, 4: 0.94, 5: 0.85 }[p.blades] ?? 0.85;
    const tD = wall_mm / p.diameter_mm;
    const fT = tD <= 0.015 ? 1 : Math.max(0.5, 1 - 3 * (tD - 0.015));
    const re = Math.max(vHubMean, 1) * (p.diameter_mm / 1000) / NU_AIR;
    const fRe = re >= 5e5 ? 1 : re <= 5e4 ? 0.6 : 0.6 + 0.4 * Math.log10(re / 5e4);
    const fTower = 0.976;
    const cpMax = pre.cp * fA * fVar * fN * fT * fRe * fTower;
    const lamOpt = pre.lam * Math.pow(aExit / 60, 0.7) * (p.blades === 2 ? 1.25 : 1);
    return { cpMax, lamOpt, lamRun: 2 * lamOpt, cq0: 2 * cpMax / lamOpt, re, f: { fA, fVar, fN, fT, fRe, fTower }, preset: pre };
  }
  const cpAt = (m, lam) => { const x = lam / m.lamOpt; return x <= 0 || x >= 2 ? 0 : m.cpMax * x * (2 - x); };   // §2.4
  const ctAt = (lam) => Math.min(1, Math.max(0.35, 1 - 0.15 * lam));                                          // §2.5

  // The whole calculation: site → wind at the hub → rotor model → power curve → AEP → rpm, torque → loads → shaft, bearing,
  // stresses, mass. `geo` = the resolved geometry parameters (wall, L/D, hub) from resolve().
  function physics(s, geo) {
    const p = geo.p, wall = geo.wf.wall_mm;
    const D = p.diameter_mm / 1000, R = D / 2, A = Math.PI * R * R;
    const rho = density(s.alt_m, s.temp_c);

    const vHub = windAt(s.v_ref, s.z_ref, s.height_m, z0);
    const k = s.weibull_k, c = weibullC(vHub, k);
    const m = rotorModel({ ...p, cp_preset: s.cp_preset }, wall, vHub);   // the Cp preset is the user's site-level choice
    const vIn = s.v_in, vRated = s.v_rated, vOut = s.v_out, vSurv = s.v_survival, idle = s.p_idle;
    const nOf = (v) => 60 * m.lamOpt * v / (Math.PI * D);                // rpm, §4.1
    const nRated = nOf(vRated);
    const eta = (v) => interp(nOf(v) / nRated, 0.15, 1.0, 0.34, 0.80);   // §4.5 η_chain(n/n_rated)
    // the curve of the AWM brochure (researches/06 §2.2, §5): the power rises up to v_out = 14 m/s («Maximum») and holds there
    // — the brake and the MPPT keep the rotor at its cut-out rpm — up to the survival speed 35 m/s; above it the rotor is parked
    const pAero = (v) => (v < vIn || v > vSurv ? 0 : 0.5 * rho * A * Math.pow(Math.min(v, vOut), 3) * cpAt(m, m.lamOpt));
    const pEl = (v) => Math.max(0, eta(Math.min(v, vRated)) * pAero(v) - (pAero(v) > 0 ? idle : 0));
    const curve = [];
    for (let v = 0; v <= 25 + 1e-9; v += 0.5) curve.push({ v, pa: pAero(v), pe: pEl(v), f: weibullPdf(v, c, k) });

    for (let v = dv / 2; v < 40; v += dv) e += pEl(v) * weibullPdf(v, c, k) * dv;
    const fSite = SITE[s.site] ?? 1;

    let wind = 0; for (let v = dv / 2; v < 40; v += dv) wind += 0.5 * rho * A * v * v * v * weibullPdf(v, c, k) * dv;
    const pRatedEl = pEl(vRated);
    // torque, §4.2: Q = Cq·½ρAv²R; starting torque at the cut-in speed
    const q = (v, lam) => (cpAt(m, lam) / Math.max(lam, 1e-6)) * 0.5 * rho * A * v * v * R;
    const q0 = m.cq0 * 0.5 * rho * A * vIn * vIn * R;
    // loads, §5.1: parking at Ve50 (Cd = 1.5 on A) governs; operation at the brake speed with Ct_design = 1.0
    const fPark = 0.5 * rho * s.ve50 * s.ve50 * 1.5 * A, fOp = 1.0 * 0.5 * rho * A * vOut * vOut;
    // shaft, §5.3: steel S_y 250 MPa, n = 3.3 (IEC γf·γm); M at the rear bearing with the overhang to the rotor's middle
    const Ls = p.ld * D, a = Ls / 2 + p.hub_back_mm / 1000;
    const M = fPark * a, T = q(vOut, m.lamOpt);
    const dShaft = Math.cbrt(32 * 3.3 / (Math.PI * 250e6) * Math.sqrt(M * M + 0.75 * T * T)) * 1000;
    const bearing = BEARINGS.find((b) => b.d >= dShaft) || BEARINGS[BEARINGS.length - 1];
    // centrifugal stress, §5.2: thin ring at the tip σ = ρ_m·v_tip², at the runaway speed λ_run·V_out
    const mat = MATERIALS[s.material] || MATERIALS.ASA;
    const vTipRun = m.lamRun * vOut, sigmaRing = mat.rho * 1000 * vTipRun * vTipRun / 1e6;
    return {
      rho, z0, vHub, k, c, model: m, curve, meanW, aep, windMeanW: wind, cf: pRatedEl > 0 ? meanW / pRatedEl : 0, fSite,
      pRatedEl, pMaxEl: pEl(vOut), rpm: { mean: nOf(vHub), rated: nRated, run: 60 * m.lamRun * vOut / (Math.PI * D) },
      torque: { rated: q(vRated, m.lamOpt), start: q0 },
      loads: { park: fPark, op: fOp, moment: M, overhang_m: a },
      shaft: { d_mm: dShaft, bearing }, stress: { vTipRun, sigmaRing, allow: mat.sz / 3.3, ok: sigmaRing <= mat.sz / 3.3 },
      material: mat,
    };
  }
  // Size the rotor for a wished electrical power at a wind speed (the «by power» mode): P = η·½ρ(πD²/4)v³·Cp → D.
  function diameterForPower(pW, v, s) {

// ---- the form, built from FIELDS
const state = {};
function buildForms() {
  for (const box of document.querySelectorAll('[data-form]')) box.innerHTML = '';
  for (const [id, form, type, def, o] of FIELDS) {
    const box = document.querySelector(`[data-form="${form}"]`);
    const wrap = document.createElement('div');
    wrap.className = 'field' + (type === 'auto' ? ' auto' : ''); wrap.dataset.id = id;
    const lab = document.createElement('label'); lab.htmlFor = 'in-' + id;
    lab.innerHTML = `${T().f[id] ?? id}${o.unit ? ` <span class="unit">${unit(o.unit)}</span>` : ''}`;
    let input;
    if (type === 'sel') {
      input = document.createElement('select');
      for (const v of o.opts) { const op = document.createElement('option'); op.value = v; op.textContent = T().o[v] ?? v; input.append(op); }
    } else {
      input = document.createElement('input'); input.type = 'number'; input.min = o.min; input.max = o.max; input.step = o.step;
      if (type === 'auto') input.placeholder = T().auto;
    }
    input.id = 'in-' + id;
    input.value = state[id] ?? def;
    input.addEventListener('input', () => { state[id] = input.value; schedule(); });
    wrap.append(lab, input);
    if (T().h[id]) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = T().h[id]; wrap.append(h); }

}

// ---- the calculation
let last = null;
function compute() {
  const s = { ...KATAK.SITE_DEFAULTS };
  for (const k of ['v_ref', 'z_ref', 'height_m', 'alt_m', 'temp_c', 'weibull_k']) s[k] = num(k);
  s.terrain = str('terrain'); s.site = str('site'); s.material = str('material'); s.cp_preset = str('cp_preset');
  let D = num('diameter_mm'), powerNote = null;
  if (str('mode') === 'power') { D = Math.round(Math.min(1500, Math.max(100, KATAK.diameterForPower(num('target_w'), num('target_v'), s))) / 10) * 10; powerNote = D; }
  const g = {
    diameter_mm: D, blades: Number(str('blades')), turns: num('turns'), angle_mode: str('angle_mode'), alpha_deg: num('alpha_deg'),
    ld: num('ld'), hub_ratio: num('hub_ratio'), hand: Number(str('hand')),
    nozzle_mm: Number(str('nozzle_mm')), layer_mm: num('layer_mm'), wall_mm: num('wall_mm'), detail: num('detail'),
    bore: str('bore'), bore_kind: str('bore_kind'), ties: num('ties'), tie_mm: num('tie_mm'),
    rim: str('rim') === 'auto' ? D >= 400 : str('rim') === 'yes', nose: str('nose') === 'yes', nose_shape: str('nose_shape'),
    nose_ratio: num('nose_ratio'), nose_gap_mm: num('nose_gap_mm'),
  };

  let geo = KATAK.resolve(g), ph = KATAK.physics(s, geo);
  const pick = str('bearing') === 'auto' ? ph.shaft.bearing : KATAK.BEARINGS.find((b) => b.id === str('bearing'));
  if (g.bore === 'bearings') Object.assign(g, { bore_mm: pick.d, bearing_od_mm: pick.D, bearing_w_mm: pick.B });

  last = { s, g, geo, ph, bearing: pick, powerNote, build: last && last.build, checks: last && last.checks, split: last && last.split };
  render();

}
