I18N.ru.info = {
  v_ref: {"d":"Среднегодовая скорость ветра на высоте измерения по данным метеостанции или ветрового атласа. По ней и по параметру k расчёт строит распределение скоростей ветра за год на высоте установки.","v":"Мощность ветрового потока пропорциональна кубу скорости. Значение по умолчанию 3,7 м/с относится к Минску: это среднее сводок METAR аэродрома Минск-1 за 1991–2018 годы на высоте 10 м. Городская метеостанция Минска даёт 2,0 м/с.","o":"Оптимума у поля нет: значение задаёт площадка. Следует вводить скорость открытой местности региона (аэродром, ветровой атлас), так как застройку расчёт учитывает типом местности и размещением. Скорость городской метеостанции учла бы город дважды: 2,0 м/с на 10 м дают на высоте 6 м в пригороде 1,56 м/с, ниже скорости включения 3 м/с.","s":"NOAA Global Hourly, запись 26850099999 «MINSK 1» (сводки METAR аэродрома, 1991–2018 годы); Камлюк Г. Г. Оценка ветроэнергетических ресурсов Республики Беларусь в условиях изменения климата // Сборник БГУ, с. 280–282 (год издания не установлен): 3,5–4,0 м/с на открытых территориях на высоте 10 м."},
  z_ref: {"d":"Высота, к которой относится введённая средняя скорость ветра. С этой высоты расчёт пересчитывает скорость на высоту установки по логарифмическому закону.","v":"Флюгеры и анеморумбометры метеостанций Белгидромета стоят на высоте 10 м. Реанализы и ветровые атласы дают скорость и на других высотах, например на 50 м.","o":"Оптимума у поля нет: значение должно совпадать с высотой, на которой получена средняя скорость. Для данных метеостанции это 10 м.","s":"Данилович И. С., Костюченко И. В. Изменения ветрового режима на территории Беларуси // Журнал БГУ. География. Геология, 2024 (39 станций, высота 10 м)."},
  height_m: {"d":"Высота оси ротора над землёй. Для этой высоты расчёт находит среднюю скорость ветра по логарифмическому профилю выбранного типа местности.","v":"Прирост скорости с высотой зависит от шероховатости: на высоте 5 м скорость составляет 88 % скорости на 10 м на ровной открытой местности и 70 % в пригороде. На высоте 5 м поправка к скорости на 10 м составляет от −6 % над морем до −43 % в центре города, поправка к мощности — до −80 %.","o":"Оптимум — наибольшая доступная высота над препятствиями. Средняя скорость на высоте установки (показана в результатах расчёта) должна превышать скорость включения 3 м/с: в Минске на высоте 6 м в пригороде она равна 2,9 м/с, и средняя мощность близка к нулю.","s":"Логарифмический профиль скорости и классы шероховатости WMO-No. 8; скорость включения 3 м/с — брошюра Archimedes Wind Turbine AWM, ESCO RTS, 2021."},
  terrain: {"d":"Тип местности вокруг установки по классам шероховатости WMO. Класс задаёт длину шероховатости z₀ в логарифмическом профиле скорости.","v":"Длина шероховатости z₀ растёт от 0,0002 м у морской поверхности до 2 м в центре города. На высоте 5 м скорость равна 94 % скорости на 10 м над морем, 88 % на ровной открытой местности, 70 % в пригороде и 57 % в центре города.","o":"Оптимума у поля нет: класс описывает окружение площадки. Для жилых кварталов рекомендуется класс «пригород, лес», для плотной застройки центра — «центр города».","s":"WMO-No. 8: классы длины шероховатости подстилающей поверхности."},
  site: {"d":"Размещение задаёт коэффициент выработки площадки f_site. Расчёт умножает на него среднюю мощность и учитывает этим турбулентность и затенение у зданий.","v":"Коэффициент f_site: открытая местность и мачта 1,0; сельская местность с препятствиями ниже установки 0,85; кровля с установкой выше конька 0,6; кровля здания 0,3; двор или балкон 0,1.","o":"Оптимум — мачта на открытой местности. На здании рекомендуется выносить ротор над коньком не менее чем на половину высоты здания. В испытаниях Warwick 26 турбин на зданиях выработали 5–10 % от выработки, заявленной производителями.","s":"Encraft, Warwick Wind Trials, Final Report, 2009; Energy Saving Trust, 2009; значения f_site — инженерная оценка KATAK по этим испытаниям."},
  alt_m: {"d":"Высота площадки над уровнем моря. По ней расчёт находит атмосферное давление и плотность воздуха по стандартной атмосфере.","v":"Мощность ветрового потока пропорциональна плотности воздуха. Плотность по стандартной атмосфере: 1,225 кг/м³ на уровне моря, 1,167 кг/м³ на 500 м, 1,112 кг/м³ на 1000 м, 1,007 кг/м³ на 2000 м.","o":"Оптимума у поля нет: значение берётся по месту установки. Для Минска задано 220 м: барометр станции Минск (WMO 26850) стоит на высоте 224,7 м.","s":"Международная стандартная атмосфера, барометрическая формула для тропосферы."},
  temp_c: {"d":"Среднегодовая температура воздуха на площадке. Расчёт подставляет её в уравнение состояния воздуха при определении плотности.","v":"Плотность воздуха обратно пропорциональна абсолютной температуре. Для Минска разброс климатических норм 6,5–7,8 °C меняет плотность на 0,5 %.","o":"Оптимума у поля нет: значение берётся по климатическим нормам места, его влияние на выработку мало. Для Минска задано 7 °C (среднее месячных норм 7,2 °C).","s":"Japan Meteorological Agency, World Climate: месячные нормы температуры для Минска."},
  weibull_k: {"d":"Параметр формы распределения Вейбулла описывает разброс скоростей ветра за год вокруг среднего. По k и средней скорости расчёт находит масштаб c = V̄/Γ(1 + 1/k) и долю времени на каждой скорости.","v":"Меньшее k даёт более широкое распределение: при равной средней скорости чаще бывают штили и сильный ветер, средний куб скорости растёт. Значение 2 соответствует распределению Рэлея, у него средний куб скорости равен 1,91·V̄³. Для континентальных площадок k лежит в пределах 1,5–2,5.","o":"Оптимума у поля нет: k берётся из ряда наблюдений площадки. Если известно стандартное отклонение скорости σ, k ≈ (σ/V̄)^−1,086. Для аэродрома Минск-1 метод моментов даёт 1,93; без данных рекомендуется k = 2.","s":"Justus C. G., 1978 (оценка k по σ); расчёт KATAK по сводкам METAR аэродрома Минск-1 (NOAA Global Hourly, запись 26850099999), 1991–2018 годы."},
  mode: {"d":"Способ задания размера ротора: прямо диаметром или требуемой мощностью при расчётной скорости ветра.","v":"«По диаметру» — диаметр вводится в поле «Диаметр ротора». «По требуемой мощности» — расчёт находит диаметр из P = η·½·ρ·(πD²/4)·v³·Cp при КПД электрической части η = 0,6 и округляет его до 10 мм в пределах 100–1500 мм.","o":"Способ «по диаметру» рекомендуется, когда размер ротора ограничен столом принтера; способ «по требуемой мощности» — когда известна нагрузка. Результаты рассчитываются полной моделью, и мощность при расчётной скорости может отличаться от требуемой, так как обратная формула не учитывает поправку на число Рейнольдса и зависимость КПД от частоты вращения.","s":"Jang et al. Analysis of Archimedes Spiral Wind Turbine Performance by Simulation and Field Test // Energies, 2019."},
  diameter_mm: {"d":"Наружный диаметр ротора на выходе. Диаметр задаёт ометаемую площадь, мощность, частоту вращения, ветровую нагрузку, диаметр вала и габарит печати.","v":"Мощность растёт пропорционально квадрату диаметра. Частота вращения при одинаковой скорости ветра обратно пропорциональна диаметру, так как скорость кромки равна λ·V при любом диаметре: ротор 0,2 м вращается в 7,5 раза быстрее ротора 1,5 м. При 12,5 м/с расчёт даёт 573 об/мин для ротора 0,75 м и 286 об/мин для ротора 1,5 м; паспорт AWM — 550 и 330 об/мин.","o":"Рекомендуется наибольший диаметр, который принтер печатает целиком или по частям. У малого ротора падает число Рейнольдса Re_D = V·D/ν, и при Re_D ниже 5·10⁴ расчёт снижает коэффициент мощности до 0,6 опорного значения. Ротор диаметром более 1 м печатается только как прототип.","s":"Брошюра Archimedes Wind Turbine AWM, ESCO RTS, 2021; Timmer W. A., Toet S., TU Delft, 2009 (Cp 0,12 у модели радиусом 0,14 м); Kim et al. // Energies, 2014."},
  target_w: {"d":"Электрическая мощность, которую установка должна развивать при расчётной скорости ветра. Поле действует при способе «по требуемой мощности»: по нему расчёт подбирает диаметр ротора.","v":"Диаметр растёт пропорционально квадратному корню из мощности: вчетверо большая мощность требует вдвое большего диаметра.","o":"Оптимума у поля нет: значение задаёт потребитель. Печатный ротор диаметром 0,2–0,6 м развивает единицы ватт: ротор 0,3 м при средней скорости 4,5 м/с даёт около 1 Вт средней мощности.","s":"Контрольные расчёты KATAK по модели Cp(λ), построенной по данным Mihalik et al. // MM Science Journal, 2024."},
  target_v: {"d":"Скорость ветра, при которой установка должна развивать требуемую мощность. Поле действует при способе «по требуемой мощности».","v":"Диаметр обратно пропорционален расчётной скорости в степени 1,5: при меньшей скорости ротор получается крупнее. У серийной турбины AWM скорость включения 3 м/с, номинальная скорость 12,5 м/с.","o":"Оптимума у поля нет: выбор зависит от скорости, при которой потребителю нужна мощность. Долю времени с такой скоростью показывает график мощности; при средней скорости 4–5 м/с ветер сильнее 12,5 м/с дует меньше 1 % времени.","s":"Брошюра Archimedes Wind Turbine AWM, ESCO RTS, 2021."},
  blades: {"d":"Число спиральных лопастей, расставленных вокруг оси через равный угол.","v":"Расчёт умножает коэффициент мощности на 0,97 для двух лопастей, 1,00 для трёх и 0,94 для четырёх. Две лопасти повышают коэффициент быстроходности в 1,25 раза по сравнению с тремя, и ротор вращается быстрее. С ростом числа лопастей сужается зазор между витками, и расчёт удлиняет ротор.","o":"Оптимум — три лопасти: у трёх лопастей наибольший коэффициент мощности и наибольший пусковой момент. Три лопасти у серийных роторов Liam F1 и AWM.","s":"Mihalik I. et al. Influence of the Number of Blades of the Archimedes Wind Turbine on its Performance // MM Science Journal, 2024."},
  turns: {"d":"Число полных оборотов внешней кромки лопасти вокруг оси от носа до выхода ротора.","v":"С ростом числа витков сужается зазор между соседними лопастями, и расчёт удлиняет ротор, чтобы зазор оставался не меньше трёх толщин стенки. В пределах 0,8–1,2 витка расчёт принимает коэффициент мощности неизменным.","o":"Рекомендуется 1 виток. Li et al. нашли оптимум 0,82 витка в диапазоне 0,8–1,6; из исследованных ими параметров у числа витков наименьшее прямое влияние. У изобретателя переход от π витков к одному витку поднял коэффициент мощности с 0,10 до 0,15.","s":"Li M., Li Z., Xu S. // Energies, 2026; Mieremet M. The aerodynamic method of the Archimedes Windturbine, 2014."},
  angle_mode: {"d":"Закон изменения угла раскрытия от носа к выходу. Угол раскрытия — угол между осью ротора и образующей лопасти.","v":"«Переменный» — 30° в передней трети, 45° в средней и 60° на выходе. «Постоянный» — один угол по всей длине, он задаётся полем «Угол раскрытия». Переменный закон требует отношения длины к диаметру 0,9, так как при 30° у носа витки сближаются; постоянному углу 60° достаточно 0,8.","o":"Рекомендуется переменный угол: исследования дают прирост коэффициента мощности 14,7–17,9 %. Расчёт принимает 10 %: это инженерная оценка KATAK внутри разброса исследований 0–18 % (в работе Song et al. профили с постоянным и переменным углом близки).","s":"Nawar et al. // Energy, 2021; Kamal et al. // Energy, 2022; Dai et al. // FDMP, 2024; Song et al. // Energies, 2023."},
  alpha_deg: {"d":"Угол между осью ротора и образующей лопасти по всей длине. Поле действует при законе угла «постоянный».","v":"Коэффициент мощности при 45°, 60° и 75° равен 0,220, 0,236 и 0,219. С ростом угла растут коэффициент быстроходности и осевая сила. При печати стоя угол нависания равен углу раскрытия.","o":"Аэродинамический оптимум лежит в пределах 60–70°, у Li et al. — 70,7°. Предел нависания пластика при печати стоя равен 55°: угол 60–70° печатается с древовидными поддержками у выходной кромки, без поддержек угол не должен превышать 55°.","s":"Sapkota et al. // IOE Graduate Conference, 2019; Hamid, Abd El Maksoud // Heliyon, 2023; Li et al. // Energies, 2026; предел нависания 55° — Bambu Lab, PLA Basic Technical Data Sheet."},
  ld: {"d":"Отношение осевой длины внешней кромки к диаметру ротора. Оно задаёт длину ротора, шаг спирали и зазор между витками.","v":"При пустом поле расчёт берёт 0,9 для переменного угла и 0,8 для постоянного и увеличивает отношение, пока зазор между соседними лопастями не достигнет трёх толщин стенки. Длинный ротор тяжелее и требует большей высоты печати. Влияние отношения на мощность в исследованиях спорно: расчёт CFD предпочитает короткий ротор, эксперимент — длинный.","o":"Рекомендуется оставить поле пустым. Ротор полевых испытаний Jang et al. диаметром 1,5 м имеет длину 1,2 м (отношение 0,8), ротор Dai et al. — 0,9.","s":"Jang et al. // Energies, 2019; Dai et al. // FDMP, 2024; Labib A. M. et al. Effect of Aspect Ratio on Aerodynamic Performance of Archimedes Spiral Wind Turbine // EIJEST (год издания не установлен); Ghonim et al. Experimental Study on the Performance of Spiral Wind Turbine // Engineering Research Journal (Menoufia), 2022."},
  hub_ratio: {"d":"Отношение диаметра ступицы к диаметру ротора. Ступица несёт корни лопастей и посадочные места подшипников.","v":"При 0,10 ступица занимает 1 % ометаемой площади; зона у оси почти не влияет на мощность, так как наибольший перепад давления лежит у кромки лопасти. Наименьший диаметр ступицы равен наружному диаметру подшипника плюс стенка в три линии с каждой стороны: у малого ротора диаметр ступицы задаёт подшипник.","o":"Рекомендуется 0,10 в пределах 0,07–0,15: у Song et al. ступица 25 мм при диаметре ротора 250 мм, у Dai et al. вал 35 мм при диаметре 360 мм.","s":"Song et al. // Energies, 2023; Dai et al. // FDMP, 2024; Kim et al. // Energies, 2014."},
  hand: {"d":"Направление закрутки спирали лопастей: правое или левое.","v":"Ротор вращается в сторону, противоположную закрутке внешней кромки при движении вниз по потоку. На мощность и нагрузки направление закрутки не влияет.","o":"Оптимума у поля нет. Направление выбирается по генератору и по резьбе стопорной гайки на оси: при вращении ротора гайка не должна откручиваться.","s":"Геометрический вывод KATAK для винтовой поверхности лопасти."},
  cp_preset: {"d":"Набор опорных значений модели Cp(λ): наибольший коэффициент мощности Cp_max и коэффициент быстроходности λ_opt, при котором он достигается. Расчёт умножает их на поправки геометрии.","v":"Реалистичная: Cp_max 0,22 при λ 1,8. Оптимистичная: 0,29 при λ 2,1 (расчёты CFD оптимизированной геометрии). Пессимистичная: 0,12 при λ 1,2 (малая модель, низкое число Рейнольдса, грубая печать). Cp_max задаёт мощность, λ_opt — частоту вращения.","o":"Для оценки выработки рекомендуется реалистичная оценка: она соответствует медиане обычных геометрий, Cp ≈ 0,23; стендовые измерения дают 0,20–0,24. Заявления производителя о 35 % и 52 % независимые данные не подтверждают.","s":"Jang et al. // Energies, 2019; Li et al. // Energies, 2026; Nawar et al. // Energy, 2021; Kamal et al. // Energy, 2022; Timmer W. A., Toet S., TU Delft, 2009."},
  nozzle_mm: {"d":"Диаметр сопла 3D-принтера. От него зависят ширина линии экструзии, толщина стенки лопасти и рабочий диапазон высоты слоя.","v":"Ширина линии равна 1,125 диаметра сопла: 0,45 мм для сопла 0,4 мм. Толщина стенки округляется вверх до целого числа линий: у сопла 0,4 мм при слое 0,2 мм две линии дают 0,86 мм, пять линий — 2,08 мм.","o":"Рекомендуется сопло, при котором стенка лопасти содержит не менее трёх линий: ширина линии не больше трети толщины стенки.","s":"Slic3r Manual, Flow Math; Prusa Research, Creating profiles for different nozzles."},
  layer_mm: {"d":"Высота слоя печати. Она входит в расчёт шага между линиями и толщины стенки.","v":"Шаг между линиями равен w − h·(1 − π/4), где w — ширина линии, h — высота слоя: при равном числе линий толстый слой немного утончает стенку. Рабочий диапазон высоты слоя 25–75 % диаметра сопла, вне его страница выводит предупреждение.","o":"Рекомендуется половина диаметра сопла: 0,2 мм для сопла 0,4 мм. При пустом поле расчёт берёт половину диаметра сопла с округлением до 0,02 мм.","s":"Slic3r Manual, Flow Math; Polymaker Wiki, Layer Height; Fast Radius, Why 3D printing layer height matters."},
  wall_mm: {"d":"Наименьшая толщина стенки лопасти. Расчёт округляет её вверх до целого числа экструзионных линий сопла.","v":"Толстая стенка прочнее и тяжелее. Выше 1,5 % диаметра расчёт снижает коэффициент мощности, так как тонкие лопасти аэродинамически лучше. При пустом поле толщина равна 0,8 % диаметра, не менее трёх линий.","o":"Рекомендуется не менее трёх линий и не более 1,5 % диаметра. Для роторов 0,15–0,25 м рекомендуется стенка 1,6–2,0 мм (0,8–1,1 % диаметра); Li et al. использовали стенку 2 мм при диаметре 0,25 м.","s":"Kamal et al. // Energy, 2022; Li et al. // Energies, 2026; Song et al. // Energies, 2023."},
  material: {"d":"Пластик ротора и обтекателя. Материал задаёт массу деталей, прочность поперёк слоёв и стойкость на солнце.","v":"Прочность поперёк слоёв σ_Z и температура размягчения HDT: ASA — 35 МПа и 100 °C, PETG — 39 МПа и 69 °C, PA-CF — 64 МПа и 194 °C, ABS — 32 МПа и 87 °C, PLA — 35 МПа и 57 °C. Расчёт сравнивает напряжение на кромке при разносе с σ_Z/3,3.","o":"Для установки под солнцем рекомендуется ASA: он стоек к ультрафиолету и погоде, но сильно коробится и требует закрытого принтера. PETG подходит для затенённых мест, PA-CF — для нагруженных деталей, PLA — только для испытаний в помещении.","s":"Bambu Lab, Technical Data Sheets: PLA Basic, PETG Basic, ABS, ASA, PAHT-CF; Prusa Knowledge Base: PLA, PETG, ASA."},
  bed_mm: {"d":"Размер стола принтера по X и Y, меньшая из сторон. Ротор печатается стоя, носовой частью вниз, и его поперечный габарит сравнивается с этим размером.","v":"Если ротор шире стола, страница выводит предупреждение; в режиме печати по частям ротор режется на детали. Ротор диаметром 220 мм стоя занимает 206 × 199 × 223 мм: три выходные кромки не заполняют полный круг.","o":"Оптимума у поля нет: вводится размер стола принтера, на котором печатается ротор. По умолчанию задан Creality Ender-3: 220 × 220 мм.","s":"Creality Ender-3, технические характеристики: область печати 220 × 220 × 250 мм."},
  bed_z_mm: {"d":"Наибольшая высота печати по Z. С ней сравнивается длина ротора вместе со ступицей.","v":"Длина ротора вместе со ступицей близка к диаметру: 223 мм при диаметре 220 мм. Если высота печати равна ширине стола, ротор первым упирается в высоту. Если ротор выше области печати, в режиме печати по частям он режется на этажи поперёк оси.","o":"Оптимума у поля нет: вводится высота области печати принтера, на котором печатается ротор. Для Creality Ender-3 это 250 мм.","s":"Creality Ender-3, технические характеристики: область печати 220 × 220 × 250 мм."},
  split: {"d":"Режим печати ротора, который не помещается в область печати. «Авто» режет такой ротор на детали, «нет» оставляет ротор целым.","v":"Ядро (центральная часть ротора внутри цилиндра разреза) режется плоскостями поперёк оси на этажи. Юбки (одинаковые части лопастей снаружи этого цилиндра) появляются, только когда этаж шире стола. Детали собираются вдоль оси со стороны носа: задний этаж, передний этаж, затем юбки. В этом режиме стяжки и обод не строятся.","o":"Рекомендуется «авто». Сборка вдоль оси проходит, пока юбка охватывает не более 120° витка: на Ender-3 это пять деталей и диаметр до 280–300 мм. Для склейки деталей из PETG рекомендуется эпоксидная смола.","s":"Расчёт сборки KATAK на геометрии ротора; Prusa Research, The ultimate guide to gluing and joining 3D prints."},
  detail: {"d":"Плотность треугольной сетки модели. Превью и файлы STL строятся с этой детализацией.","v":"10 % — 48 отсчётов вдоль витка, 4 поперёк лопасти и 32 по окружности; 100 % — 384, 16 и 160 отсчётов. Каждый треугольник добавляет к двоичному файлу STL 50 байт, плотная сетка дольше строится.","o":"Источника оптимума нет: выбор зависит от диаметра ротора и точности принтера. Грубая сетка видна гранями на кромках и ступице, плотная увеличивает файл STL и время построения превью. По умолчанию задано 70 %.","s":"Kaitai Struct, спецификация формата STL; Wikipedia, STL (file format)."},
  bore: {"d":"Исполнение оси: способ посадки ротора на ось.","v":"«Стальной вал на подшипниках» — в торцах ступицы печатаются посадочные места под два подшипника с натягом 0,1 мм, вал проходит ступицу с зазором. «Отверстие заданного профиля» — сквозное отверстие под ось с зазором 0,1 мм. «Печатная ось» — ступица печатается сплошной, сечение печатной оси задаёт поле «Профиль отверстия или оси».","o":"Рекомендуется стальной вал на подшипниках. Для ротора 0,3 м стальной вал требует диаметра 10,7 мм, печатная ось из PLA — 20 мм, и PLA ползёт под нагрузкой.","s":"Расчёт вала на изгиб с кручением по энергетической теории прочности; запасы прочности IEC 61400-2 по Lontsie M. K., TalTech, 2019."},
  bearing: {"d":"Типоразмер двух радиальных шарикоподшипников в торцах ступицы. Внутренний диаметр подшипника задаёт диаметр оси.","v":"Размеры (внутренний диаметр × наружный диаметр × ширина): 608 — 8 × 22 × 7 мм; 6000 — 10 × 26 × 8 мм; 6001 — 12 × 28 × 8 мм; 6002 — 15 × 32 × 9 мм; 6003 — 17 × 35 × 10 мм; 6004 — 20 × 42 × 12 мм; 6005 — 25 × 47 × 12 мм. «Авто» берёт наименьший подшипник, внутренний диаметр которого не меньше расчётного диаметра стального вала.","o":"Рекомендуется «авто»: стальной вал (предел текучести 250 МПа, запас 3,3) рассчитан на стоянку ротора при скорости ветра 42 м/с. Если подшипник тоньше расчётного вала, страница выводит предупреждение; подшипник 608 подходит под шпильку M8 или трубку 8 мм.","s":"IEC 61400-2: класс IV, Ve50 = 42 м/с, коэффициенты γf = 3,0 и γm = 1,1 (по Lontsie M. K., TalTech, 2019); NTN-SNR, каталог Deep Groove Ball Bearings."},
  bore_kind: {"d":"Форма сечения отверстия в ступице или печатной оси. Поле действует при исполнениях «отверстие заданного профиля» и «печатная ось».","v":"Круг — размер равен диаметру. Шестигранник и квадрат — размер равен расстоянию между противоположными гранями. D-образный срез — круг с лыской глубиной около 0,1 диаметра. Некруглый профиль удерживает ступицу от проворота на оси.","o":"Рекомендуется шестигранник или D-образный срез, когда ротор передаёт момент на вал генератора: стандарт IEC 61400-2 требует рассчитывать ступицу на момент короткого замыкания генератора, вдвое больше расчётного.","s":"IEC 61400-2, расчётный случай F «короткое замыкание генератора» (по Lontsie M. K., TalTech, 2019)."},
  bore_mm: {"d":"Диаметр оси или размер профиля отверстия. При пустом поле он равен внутреннему диаметру выбранного подшипника.","v":"К размеру отверстия в ступице расчёт добавляет 0,1 мм: такой зазор лежит в диапазоне прессовой посадки, от −0,05 до +0,2 мм. Глухое отверстие обтекателя под конец оси получает зазор 0,2 мм и глубину около 1,5 диаметра оси.","o":"Диаметр оси должен быть не меньше минимального диаметра стального вала из результатов. Для скользящей посадки (зазор 0,15–0,4 мм) следует ввести диаметр оси, увеличенный на 0,05–0,3 мм. Зазор зависит от принтера, и рекомендуется напечатать пробник.","s":"Sovol, FDM 3D printing tolerances and clearances; University of the Arts London, Design the clearance and tolerance."},
  ties: {"d":"Число меридиональных полуплоскостей со стяжками. Стяжка — осевая печатная стойка между соседними витками, она связывает лопасти и гасит их взаимные колебания.","v":"Стяжки стоят на 70 % размаха лопасти и печатаются стоя без поддержек. По умолчанию стяжек нет, так как стяжка толще лопасти в осевом направлении выходит из наклонной лопасти наружу. При печати по частям стяжки не строятся.","o":"До диаметра 0,25 м подкрепление не обязательно. При 0,25–0,6 м рекомендуется пояс из трёх стяжек через 120°. Расчёт не проверяет, помещается ли стяжка внутри лопасти: это следует проверить на превью. Серийный ротор держит лопасти поперечными стальными связями.","s":"Mihalik et al. // MM Science Journal, 2024 (стальные связи серийного ротора); схема стяжек — инженерная оценка KATAK."},
  tie_mm: {"d":"Диаметр печатной стяжки. Поле действует при числе стяжек больше нуля.","v":"Толстая стяжка жёстче. Стяжка, толщина которой превышает осевую толщину лопасти, выходит из наклонной лопасти наружу.","o":"Источника оптимального диаметра печатной стяжки нет. Сверху диаметр ограничен осевой толщиной лопасти, снизу — наименьшей печатаемой деталью в две линии сопла (0,86 мм для сопла 0,4 мм при слое 0,2 мм).","s":"Slic3r Manual, Flow Math (толщина детали из двух линий); ограничение по толщине лопасти — геометрия ротора KATAK."},
  rim: {"d":"Обод — кольцо, которое соединяет выходные кромки лопастей. Обод придаёт выходу ротора жёсткость.","v":"«Авто» строит обод при диаметре от 400 мм. Обод несёт массу на периферии: напряжение в кольце равно ρ·v², где ρ — плотность пластика, v — скорость кромки, и от диаметра оно не зависит. При печати по частям обод не строится.","o":"Рекомендуется «авто»: обод нужен при диаметре 0,4–0,6 м и должен быть лёгким. Модель изобретателя 2009 года разрушилась при 21 м/с от центробежной силы свинцовых грузов на внешнем кольце.","s":"Mieremet M. The aerodynamic method of the Archimedes Windturbine, 2014; инженерная оценка KATAK."},
  nose: {"d":"Носовой обтекатель — отдельная печатная деталь вращения на оси перед ротором. Он закрывает торец оси и крепёж.","v":"Обтекатель даёт потоку гладкий вход в ротор: меньше отрыв и свист. Площадь внутри ступицы составляет 1 % ометаемой. В расчёте мощности обтекатель не учитывается, так как его ожидаемое влияние на коэффициент мощности оценивается в 1–3 %.","o":"Рекомендуется «да»: обтекатель защищает торец оси и крепёж от воды, пыли и льда.","s":"Kim et al. // Energies, 2014 (конус ступицы в модели CFD); инженерная оценка KATAK."},
  nose_shape: {"d":"Профиль образующей обтекателя от вершины до основания.","v":"Эллипсоид — тупой нос, касается основания без излома. Касательное оживало стройнее эллипсоида. Конус даёт излом у основания, где поток отрывается. Стрела (гладкая сигмоида 2u² − u⁴) — тонкий вогнутый нос и выпуклое основание, вершина скруглена до одной линии сопла. Смачиваемая площадь при удлинении 0,8 (R — радиус основания): эллипсоид 2,84 πR², оживало 2,59 πR², конус 1,89 πR², стрела 1,83 πR².","o":"При скорости ветра до 25 м/с число Маха составляет не более 0,073. При числе Маха ниже 0,8 сопротивление давления носа близко к нулю для всех форм, и сопротивление определяет трение по смачиваемой площади. Для дозвукового потока Crowell рекомендует короткий тупой эллиптический нос; у стрелы наименьшая смачиваемая площадь, но измерений для неё нет. Конус не рекомендуется.","s":"Crowell G. A. The Descriptive Geometry of Nose Cones, 1996; площади — расчёт KATAK."},
  nose_ratio: {"d":"Удлинение обтекателя — отношение его длины к диаметру основания. Диаметр основания равен диаметру ступицы.","v":"Длина обтекателя равна удлинению, умноженному на диаметр основания. Длинный обтекатель стройнее и тяжелее, его смачиваемая площадь больше.","o":"Рекомендуется 0,8 в пределах 0,6–1,0. Это инженерная оценка KATAK: измеренного влияния носового обтекателя на коэффициент мощности ветротурбин не найдено, и для дозвукового потока Crowell рекомендует короткий тупой нос.","s":"Инженерная оценка KATAK по формам носовых частей (Crowell G. A. The Descriptive Geometry of Nose Cones, 1996)."},
  nose_gap_mm: {"d":"Расстояние от основания обтекателя до носа ротора. В этом промежутке стоит стойка переднего подшипника.","v":"Основание обтекателя плоское, за ним стоит стойка: сопротивление торца и стойки больше разницы между профилями обтекателя. Касательное сопряжение профиля с основанием даёт аэродинамический выигрыш, только когда основание почти упирается в ступицу.","o":"Рекомендуется наименьшее расстояние, при котором помещается стойка переднего подшипника; поле принимает 10–100 мм.","s":"Инженерная оценка KATAK; роль трения и разрывов формы — Crowell G. A. The Descriptive Geometry of Nose Cones, 1996."},
};
I18N.en.info = {
  v_ref: {"d":"The annual mean wind speed at the measurement height, taken from a weather station or a wind atlas. From it and from k the calculation builds the distribution of wind speeds over the year at the installation height.","v":"The power in the wind grows with the cube of the speed. The default of 3.7 m/s is the Minsk value: the mean of the METAR reports of the Minsk-1 airfield for 1991–2018 at 10 m. The city weather station of Minsk gives 2.0 m/s.","o":"There is no optimum: the value belongs to the site. Enter the open-terrain wind of the region (an airfield, a wind atlas), since the terrain type and the placement already account for buildings. A city-station value would count the city twice: 2.0 m/s at 10 m becomes 1.56 m/s at 6 m in a suburb, below the cut-in speed of 3 m/s.","s":"NOAA Global Hourly, record 26850099999 “MINSK 1” (METAR reports of the airfield, 1991–2018); G. G. Kamlyuk, Assessment of the wind energy resources of the Republic of Belarus under climate change, BSU proceedings, pp. 280–282 (year of publication not established): 3.5–4.0 m/s at 10 m over open terrain."},
  z_ref: {"d":"The height at which the entered mean speed was measured. The calculation transfers the speed from this height to the installation height by the logarithmic law.","v":"The vanes and anemometers of the Belarusian weather stations stand at 10 m. Reanalyses and wind atlases also give the speed at other heights, for example at 50 m.","o":"There is no optimum: the value must match the height of the entered mean speed. For weather-station data it is 10 m.","s":"I. S. Danilovich, I. V. Kostyuchenko, Changes of the wind regime in Belarus, Journal of the Belarusian State University: Geography and Geology, 2024 (39 stations, 10 m)."},
  height_m: {"d":"The height of the rotor axis above the ground. The calculation finds the mean wind speed at this height from the logarithmic profile of the selected terrain.","v":"How much the speed gains with height depends on the roughness: at 5 m the speed is 88 % of the 10 m value over flat open terrain and 70 % in a suburb. At 5 m the correction to the 10 m speed ranges from −6 % over the sea to −43 % in a city centre, and the correction to power reaches −80 %.","o":"The optimum is the greatest height available above the obstacles. The mean speed at the installation height (shown in the results) should exceed the cut-in speed of 3 m/s: in a Minsk suburb at 6 m it is 2.9 m/s, and the mean power is close to zero.","s":"Logarithmic wind profile and the roughness classes of WMO-No. 8; cut-in speed of 3 m/s from the Archimedes Wind Turbine AWM brochure, ESCO RTS, 2021."},
  terrain: {"d":"The terrain around the installation, by the WMO roughness classes. The class sets the roughness length z₀ of the logarithmic speed profile.","v":"z₀ ranges from 0.0002 m over the sea to 2 m in a city centre. At 5 m the speed is 94 % of the 10 m value over the sea, 88 % over flat open terrain, 70 % in a suburb and 57 % in a city centre.","o":"There is no optimum: the class describes the surroundings of the site. Choose “suburb, forest” for residential districts and “city centre” for dense central blocks.","s":"WMO-No. 8: roughness-length classes of the terrain."},
  site: {"d":"The placement sets the site yield factor f_site. The calculation multiplies the mean power by it to account for turbulence and shading near buildings.","v":"f_site is 1.0 for a mast in open terrain, 0.85 for rural land with obstacles below the installation, 0.6 for a roof with the rotor above the ridge, 0.3 for a building roof and 0.1 for a yard or a balcony.","o":"A mast in open terrain is the optimum. On a building, raise the rotor above the ridge by at least half the height of the building. In the Warwick trials, 26 building-mounted turbines produced 5–10 % of the yield their makers claimed.","s":"Encraft, Warwick Wind Trials, Final Report, 2009; Energy Saving Trust, 2009; the f_site values are a KATAK engineering estimate based on these trials."},
  alt_m: {"d":"The altitude of the site above sea level. From it the calculation finds the air pressure and density by the standard atmosphere.","v":"The power in the wind is proportional to the air density. The standard atmosphere gives 1.225 kg/m³ at sea level, 1.167 kg/m³ at 500 m, 1.112 kg/m³ at 1000 m and 1.007 kg/m³ at 2000 m.","o":"There is no optimum: enter the altitude of the site. The Minsk default is 220 m; the barometer of the Minsk station (WMO 26850) stands at 224.7 m.","s":"International Standard Atmosphere, barometric formula for the troposphere."},
  temp_c: {"d":"The mean annual air temperature at the site. The calculation uses it in the equation of state when it finds the air density.","v":"Air density is inversely proportional to the absolute temperature. For Minsk the spread of the climate normals, 6.5–7.8 °C, changes the density by 0.5 %.","o":"There is no optimum: take the value from the local climate normals; its effect on the yield is small. The Minsk default is 7 °C (the monthly normals average 7.2 °C).","s":"Japan Meteorological Agency, World Climate: monthly temperature normals for Minsk."},
  weibull_k: {"d":"The shape parameter of the Weibull distribution describes how widely the wind speeds of a year spread around the mean. From k and the mean speed the calculation finds the scale c = V̄/Γ(1 + 1/k) and the share of time at each speed.","v":"A smaller k gives a wider distribution: at an equal mean speed both calms and strong winds become more frequent, and the mean cube of the speed grows. k = 2 is the Rayleigh distribution, whose mean cube of the speed is 1.91·V̄³. Typical continental sites lie between 1.5 and 2.5.","o":"There is no optimum: k comes from the observations at the site. When the standard deviation σ of the speed is known, k ≈ (σ/V̄)^−1.086. The method of moments gives 1.93 for the Minsk-1 airfield; without data, k = 2 is recommended.","s":"C. G. Justus, 1978 (k from σ); KATAK calculation from the METAR reports of the Minsk-1 airfield (NOAA Global Hourly, record 26850099999), 1991–2018."},
  mode: {"d":"How the rotor size is set: directly by the diameter, or by the required power at a design wind speed.","v":"“By diameter” takes the value of the Rotor diameter field. “By required power” solves P = η·½·ρ·(πD²/4)·v³·Cp for the diameter with an electrical efficiency η = 0.6 and rounds it to 10 mm within 100–1500 mm.","o":"Use “by diameter” when the printer bed limits the rotor size and “by required power” when the load is known. The results come from the full model, and the power at the design speed may differ from the required one, since the inverse formula leaves out the Reynolds-number correction and the dependence of the efficiency on the rotational speed.","s":"Jang et al., Analysis of Archimedes Spiral Wind Turbine Performance by Simulation and Field Test, Energies, 2019."},
  diameter_mm: {"d":"The outer diameter of the rotor at the exit. It sets the swept area, the power, the rotational speed, the wind load, the shaft diameter and the print size.","v":"The power grows with the square of the diameter. At equal wind speed the rotational speed is inversely proportional to the diameter, since the tip speed equals λ·V whatever the diameter: a 0.2 m rotor turns 7.5 times faster than a 1.5 m one. At 12.5 m/s the calculation gives 573 rpm for a 0.75 m rotor and 286 rpm for a 1.5 m rotor; the AWM data sheet states 550 and 330 rpm.","o":"Choose the largest diameter the printer can make in one piece or from parts. A small rotor also runs at a low Reynolds number Re_D = V·D/ν: below Re_D = 5·10⁴ the calculation cuts the power coefficient to 0.6 of its reference value. Rotors over 1 m are printed only as prototypes.","s":"Archimedes Wind Turbine AWM brochure, ESCO RTS, 2021; W. A. Timmer, S. Toet, TU Delft, 2009 (Cp 0.12 for a model of 0.14 m radius); Kim et al., Energies, 2014."},
  target_w: {"d":"The electrical power the installation must deliver at the design wind speed. In the “by required power” mode the calculation sizes the rotor from it.","v":"The diameter grows with the square root of the power: four times the power needs twice the diameter.","o":"There is no optimum: the load sets the value. A printed rotor of 0.2–0.6 m delivers a few watts; a 0.3 m rotor in a mean wind of 4.5 m/s gives about 1 W of mean power.","s":"KATAK reference calculations with the Cp(λ) model fitted to the data of Mihalik et al., MM Science Journal, 2024."},
  target_v: {"d":"The wind speed at which the installation must deliver the required power. The field works in the “by required power” mode.","v":"The diameter is inversely proportional to the design speed raised to the power 1.5: a lower design speed gives a larger rotor. The AWM production turbine cuts in at 3 m/s and reaches its rated power at 12.5 m/s.","o":"There is no optimum: choose the speed at which the load needs its power. The power chart shows how often the site sees that speed; at a mean wind of 4–5 m/s, speeds above 12.5 m/s occur less than 1 % of the time.","s":"Archimedes Wind Turbine AWM brochure, ESCO RTS, 2021."},
  blades: {"d":"The number of spiral blades, spaced evenly around the axis.","v":"The calculation multiplies the power coefficient by 0.97 for two blades, 1.00 for three and 0.94 for four. Two blades raise the tip speed ratio by a factor of 1.25 over three, so the rotor turns faster. More blades narrow the gap between the turns, and the calculation lengthens the rotor.","o":"Three blades are the optimum: they give the highest power coefficient and the highest starting torque. The Liam F1 and AWM production rotors have three blades.","s":"I. Mihalik et al., Influence of the Number of Blades of the Archimedes Wind Turbine on its Performance, MM Science Journal, 2024."},
  turns: {"d":"The number of full revolutions the outer blade edge makes around the axis from the nose to the exit.","v":"More turns narrow the gap between neighbouring blades, and the calculation lengthens the rotor to keep that gap at three wall thicknesses or more. Between 0.8 and 1.2 turns the power coefficient is taken as unchanged.","o":"One turn is recommended. Li et al. found an optimum of 0.82 turns within 0.8–1.6; of the parameters they studied, the number of turns has the weakest direct effect. The inventor's move from π turns to one turn raised the power coefficient from 0.10 to 0.15.","s":"M. Li, Z. Li, S. Xu, Energies, 2026; M. Mieremet, The aerodynamic method of the Archimedes Windturbine, 2014."},
  angle_mode: {"d":"How the opening angle changes from the nose to the exit. The opening angle is the angle between the rotor axis and the generatrix (the straight generating line) of the blade.","v":"“Variable” uses 30° in the front third, 45° in the middle and 60° at the exit. “Constant” keeps one angle along the whole length, set in the Opening angle field. The variable law needs a length-to-diameter ratio of 0.9, since the turns crowd together at 30° near the nose; a constant 60° needs 0.8.","o":"The variable angle is recommended: studies report a gain in power coefficient of 14.7–17.9 %. The calculation takes 10 %, a KATAK engineering estimate within the 0–18 % spread of the studies (Song et al. found the constant and variable profiles close).","s":"Nawar et al., Energy, 2021; Kamal et al., Energy, 2022; Dai et al., FDMP, 2024; Song et al., Energies, 2023."},
  alpha_deg: {"d":"The angle between the rotor axis and the generatrix (the straight generating line) of the blade along the whole length. The field works with the “constant” angle law.","v":"The power coefficient is 0.220 at 45°, 0.236 at 60° and 0.219 at 75°. A larger angle raises the tip speed ratio and the axial thrust. Printed upright, the overhang angle equals the opening angle.","o":"The aerodynamic optimum lies between 60° and 70°; Li et al. found 70.7°. The overhang limit of the plastic printed upright is 55°: an angle of 60–70° prints with tree supports at the exit edge, and without supports the angle must stay at 55° or below.","s":"Sapkota et al., IOE Graduate Conference, 2019; Hamid, Abd El Maksoud, Heliyon, 2023; Li et al., Energies, 2026; the 55° overhang limit from the Bambu Lab PLA Basic Technical Data Sheet."},
  ld: {"d":"The axial length of the outer blade edge divided by the rotor diameter. It sets the rotor length, the spiral pitch and the gap between the turns.","v":"When the field is empty, the calculation starts from 0.9 for the variable angle and 0.8 for the constant one and raises the ratio until the gap between neighbouring blades reaches three wall thicknesses. A longer rotor is heavier and needs more build height. The effect on power is disputed: CFD favours a short rotor, experiment a long one.","o":"Leave the field empty. The field-test rotor of Jang et al. is 1.2 m long at 1.5 m in diameter (a ratio of 0.8); the rotor of Dai et al. has 0.9.","s":"Jang et al., Energies, 2019; Dai et al., FDMP, 2024; A. M. Labib et al., Effect of Aspect Ratio on Aerodynamic Performance of Archimedes Spiral Wind Turbine, EIJEST (year of publication not established); Ghonim et al., Experimental Study on the Performance of Spiral Wind Turbine, Engineering Research Journal (Menoufia), 2022."},
  hub_ratio: {"d":"The hub diameter divided by the rotor diameter. The hub carries the blade roots and the bearing seats.","v":"At 0.10 the hub covers 1 % of the swept area; the zone near the axis hardly affects the power, as the largest pressure difference lies at the blade edge. The hub is never smaller than the bearing's outer diameter plus a three-line wall on each side, so on a small rotor the bearing sets the hub diameter.","o":"0.10 within 0.07–0.15 is recommended: Song et al. used a 25 mm hub on a 250 mm rotor, Dai et al. a 35 mm shaft on a 360 mm rotor.","s":"Song et al., Energies, 2023; Dai et al., FDMP, 2024; Kim et al., Energies, 2014."},
  hand: {"d":"The winding direction of the blade spiral: right-hand or left-hand.","v":"The rotor turns opposite to the winding of the outer edge, traced downstream. The winding direction changes neither the power nor the loads.","o":"There is no optimum. Choose the direction to suit the generator and the thread of the lock nut on the axle: the nut must not work loose as the rotor turns.","s":"KATAK geometric derivation for the helical blade surface."},
  cp_preset: {"d":"The reference values of the Cp(λ) model: the peak power coefficient Cp_max and the tip speed ratio λ_opt at which it occurs. The calculation multiplies them by the geometry corrections.","v":"Realistic: Cp_max 0.22 at λ 1.8. Optimistic: 0.29 at λ 2.1 (CFD of optimised geometries). Pessimistic: 0.12 at λ 1.2 (a small model, a low Reynolds number, a rough print). Cp_max sets the power, λ_opt the rotational speed.","o":"The realistic estimate is recommended for yield estimates: it matches the median of conventional geometries, Cp ≈ 0.23, and bench measurements give 0.20–0.24. Independent data do not support the maker's claims of 35 % and 52 %.","s":"Jang et al., Energies, 2019; Li et al., Energies, 2026; Nawar et al., Energy, 2021; Kamal et al., Energy, 2022; W. A. Timmer, S. Toet, TU Delft, 2009."},
  nozzle_mm: {"d":"The nozzle diameter of the 3D printer. It sets the extrusion line width, the blade wall thickness and the working range of the layer height.","v":"The line width is 1.125 times the nozzle diameter, 0.45 mm for a 0.4 mm nozzle. The wall is rounded up to a whole number of lines: with a 0.4 mm nozzle and 0.2 mm layers, two lines make 0.86 mm and five lines 2.08 mm.","o":"Choose a nozzle that puts at least three lines into the blade wall, which means a line width of no more than a third of the wall.","s":"Slic3r Manual, Flow Math; Prusa Research, Creating profiles for different nozzles."},
  layer_mm: {"d":"The print layer height. It enters the line spacing and the wall thickness.","v":"The line spacing is w − h·(1 − π/4), where w is the line width and h the layer height: for an equal number of lines a thicker layer makes the wall slightly thinner. The working range is 25–75 % of the nozzle diameter; outside it the page shows a warning.","o":"Half the nozzle diameter is recommended: 0.2 mm for a 0.4 mm nozzle. When the field is empty, the calculation takes half the nozzle diameter, rounded to 0.02 mm.","s":"Slic3r Manual, Flow Math; Polymaker Wiki, Layer Height; Fast Radius, Why 3D printing layer height matters."},
  wall_mm: {"d":"The minimum blade wall thickness. The calculation rounds it up to a whole number of extrusion lines.","v":"A thicker wall is stronger and heavier. Above 1.5 % of the diameter the calculation lowers the power coefficient, as thin blades perform better aerodynamically. When the field is empty, the wall is 0.8 % of the diameter and at least three lines.","o":"No fewer than three lines and no more than 1.5 % of the diameter is recommended. For rotors of 0.15–0.25 m a wall of 1.6–2.0 mm (0.8–1.1 % of the diameter) is recommended; Li et al. used a 2 mm wall on a 0.25 m rotor.","s":"Kamal et al., Energy, 2022; Li et al., Energies, 2026; Song et al., Energies, 2023."},
  material: {"d":"The plastic of the rotor and the fairing. It sets the part mass, the strength across the layers and the resistance to sunlight.","v":"Strength across the layers σ_Z and heat deflection temperature HDT: ASA 35 MPa and 100 °C, PETG 39 MPa and 69 °C, PA-CF 64 MPa and 194 °C, ABS 32 MPa and 87 °C, PLA 35 MPa and 57 °C. The calculation compares the tip stress at runaway with σ_Z/3.3.","o":"ASA is recommended for a turbine in the sun: it resists UV and weather, but it warps strongly and needs an enclosed printer. PETG suits shaded places, PA-CF loaded parts, and PLA indoor tests only.","s":"Bambu Lab Technical Data Sheets: PLA Basic, PETG Basic, ABS, ASA, PAHT-CF; Prusa Knowledge Base: PLA, PETG, ASA."},
  bed_mm: {"d":"The size of the printer bed in X and Y, the smaller side. The rotor is printed upright, nose down, and its footprint is checked against this size.","v":"When the rotor is wider than the bed, the page shows a warning; in the print-from-parts mode the rotor is cut into parts. A 220 mm rotor printed upright occupies 206 × 199 × 223 mm, as the three exit edges do not fill a full circle.","o":"There is no optimum: enter the bed of the printer that will print the rotor. The default is the Creality Ender-3, 220 × 220 mm.","s":"Creality Ender-3 specifications: build volume 220 × 220 × 250 mm."},
  bed_z_mm: {"d":"The largest print height in Z. The rotor length including the hub is checked against it.","v":"The rotor length including the hub is close to the diameter: 223 mm for a 220 mm rotor. When the build height equals the bed width, the rotor meets the height limit first. In the print-from-parts mode a rotor taller than the build volume is cut into floors across the axis.","o":"There is no optimum: enter the build height of the printer that will print the rotor. For the Creality Ender-3 it is 250 mm.","s":"Creality Ender-3 specifications: build volume 220 × 220 × 250 mm."},
  split: {"d":"How a rotor that does not fit the build volume is printed. “Auto” cuts such a rotor into parts; “no” keeps it whole.","v":"The core (the central part of the rotor inside the cutting cylinder) is cut into floors by planes across the axis. The skirts (identical parts of the blades outside that cylinder) appear only when a floor is wider than the bed. The parts assemble along the axis from the nose: the rear floor, the front floor, then the skirts. Ties and the exit rim are not built in this mode.","o":"“Auto” is recommended. Axial assembly works while a skirt wraps no more than 120° of the turn: on an Ender-3 that means five parts and a diameter of up to 280–300 mm. Epoxy is recommended for gluing PETG parts.","s":"KATAK assembly calculation on the rotor geometry; Prusa Research, The ultimate guide to gluing and joining 3D prints."},
  detail: {"d":"The density of the triangle mesh of the model. The preview and the STL files use this detail.","v":"10 % gives 48 samples along the wrap, 4 across the blade and 32 around a circle; 100 % gives 384, 16 and 160. Each triangle adds 50 bytes to a binary STL file, and a denser mesh takes longer to build.","o":"No source gives an optimum: the choice depends on the rotor diameter and the precision of the printer. A coarse mesh shows facets on the edges and the hub; a dense one enlarges the STL file and the preview build time. The default is 70 %.","s":"Kaitai Struct, STL format specification; Wikipedia, STL (file format)."},
  bore: {"d":"The axle arrangement: how the rotor sits on its axle.","v":"“Steel shaft on bearings” prints seats for two bearings in the hub ends with a 0.1 mm press fit, and the shaft passes through the hub with clearance. “Hole of a given profile” makes a through hole for the axle with 0.1 mm clearance. “Printed axle” prints the hub solid, and the Hole or axle profile field sets the cross-section of the printed axle.","o":"A steel shaft on bearings is recommended. For a 0.3 m rotor a steel shaft needs 10.7 mm, a printed PLA axle 20 mm, and PLA creeps under load.","s":"Shaft sized for bending with torsion by the distortion-energy theory; IEC 61400-2 safety factors after M. K. Lontsie, TalTech, 2019."},
  bearing: {"d":"The size of the two deep-groove ball bearings in the hub ends. The bearing bore sets the axle diameter.","v":"Bore × outer diameter × width: 608 is 8 × 22 × 7 mm; 6000 is 10 × 26 × 8 mm; 6001 is 12 × 28 × 8 mm; 6002 is 15 × 32 × 9 mm; 6003 is 17 × 35 × 10 mm; 6004 is 20 × 42 × 12 mm; 6005 is 25 × 47 × 12 mm. “Auto” takes the smallest bearing whose bore is not below the computed steel shaft diameter.","o":"“Auto” is recommended: the steel shaft (yield strength 250 MPa, safety factor 3.3) is sized for the parked rotor in a 42 m/s wind. A bearing thinner than the computed shaft triggers a warning; a 608 takes an M8 threaded rod or an 8 mm tube.","s":"IEC 61400-2: class IV, Ve50 = 42 m/s, factors γf = 3.0 and γm = 1.1 (after M. K. Lontsie, TalTech, 2019); NTN-SNR, Deep Groove Ball Bearings catalogue."},
  bore_kind: {"d":"The cross-section of the hole in the hub or of the printed axle. The field works with the “hole of a given profile” and “printed axle” arrangements.","v":"Round: the size is the diameter. Hexagon and square: the size is the distance across flats. D-cut: a circle with a flat about 0.1 of the diameter deep. A non-round profile keeps the hub from turning on the axle.","o":"A hexagon or a D-cut is recommended when the rotor drives the generator shaft: the IEC 61400-2 standard requires the hub to carry the generator short-circuit torque, twice the design torque.","s":"IEC 61400-2, load case F, generator short circuit (after M. K. Lontsie, TalTech, 2019)."},
  bore_mm: {"d":"The axle diameter or the size of the hole profile. When the field is empty, it equals the bore of the selected bearing.","v":"The calculation adds 0.1 mm to the hole in the hub, which falls in the press-fit range of −0.05 to +0.2 mm. The blind hole of the fairing for the axle end gets 0.2 mm of clearance and a depth of about 1.5 axle diameters.","o":"The axle should be no thinner than the minimum steel shaft diameter in the results. For a sliding fit (0.15–0.4 mm of clearance), enter the axle diameter plus 0.05–0.3 mm. The clearance depends on the printer, and a test print is recommended.","s":"Sovol, FDM 3D printing tolerances and clearances; University of the Arts London, Design the clearance and tolerance."},
  ties: {"d":"The number of meridional half-planes carrying ties. A tie is an axial printed post between neighbouring turns; it links the blades and damps their vibration against each other.","v":"The ties stand at 70 % of the blade span and print upright without supports. There are no ties by default, since a tie thicker than the blade in the axial direction breaks out of the inclined blade. They are not built in the print-from-parts mode.","o":"Rotors up to 0.25 m need no reinforcement. For 0.25–0.6 m one belt of three ties 120° apart is recommended. The calculation does not check whether a tie fits inside the blade, so check it on the preview. The production rotor holds its blades with transverse steel ties.","s":"Mihalik et al., MM Science Journal, 2024 (steel ties of the production rotor); the tie layout is a KATAK engineering estimate."},
  tie_mm: {"d":"The diameter of a printed tie. The field works when the number of ties is above zero.","v":"A thicker tie is stiffer. A tie thicker than the axial thickness of the blade breaks out of the inclined blade.","o":"No source gives an optimum diameter for a printed tie. The axial thickness of the blade limits it from above, and the smallest printable feature of two nozzle lines limits it from below (0.86 mm for a 0.4 mm nozzle at 0.2 mm layers).","s":"Slic3r Manual, Flow Math (thickness of a two-line feature); the limit by the blade thickness follows from the KATAK rotor geometry."},
  rim: {"d":"The exit rim is a ring that joins the exit edges of the blades. It stiffens the exit of the rotor.","v":"“Auto” adds the rim from 400 mm in diameter. The rim puts mass at the periphery: its hoop stress is ρ·v², where ρ is the plastic density and v the tip speed, whatever the diameter. The rim is not built in the print-from-parts mode.","o":"“Auto” is recommended: a rim is needed at 0.4–0.6 m and must stay light. The inventor's 2009 model broke at 21 m/s under the centrifugal force of lead balancing weights on its outer ring.","s":"M. Mieremet, The aerodynamic method of the Archimedes Windturbine, 2014; KATAK engineering estimate."},
  nose: {"d":"The nose fairing is a separate printed body of revolution on the axle ahead of the rotor. It covers the axle end and the fasteners.","v":"The fairing lets the flow enter the rotor smoothly, with less separation and whistling. The area inside the hub is 1 % of the swept area. The power calculation leaves the fairing out, since its expected effect on the power coefficient is estimated at 1–3 %.","o":"“Yes” is recommended: the fairing shields the axle end and the fasteners from water, dust and ice.","s":"Kim et al., Energies, 2014 (the hub cone of the CFD model); KATAK engineering estimate."},
  nose_shape: {"d":"The profile of the fairing from the tip to the base.","v":"Ellipsoid: a blunt nose that meets the base without a kink. Tangent ogive: slimmer than the ellipsoid. Cone: a kink at the base where the flow separates. Arrow (smooth sigmoid 2u² − u⁴): a thin concave tip and a convex base, the tip rounded to one nozzle line. Wetted area at a length-to-diameter ratio of 0.8, with R the base radius: ellipsoid 2.84 πR², ogive 2.59 πR², cone 1.89 πR², arrow 1.83 πR².","o":"At wind speeds up to 25 m/s the Mach number is 0.073 at most; below Mach 0.8 the pressure drag of a nose is close to zero for every shape, and skin friction over the wetted area decides. Crowell recommends a short, blunt elliptical nose for subsonic flow; the arrow has the smallest wetted area, but it has not been measured. The cone is not recommended.","s":"G. A. Crowell, The Descriptive Geometry of Nose Cones, 1996; areas calculated by KATAK."},
  nose_ratio: {"d":"The fairing slenderness: its length divided by its base diameter. The base diameter equals the hub diameter.","v":"The fairing length is this ratio times the base diameter. A longer fairing is slimmer and heavier, and its wetted area is larger.","o":"0.8 within 0.6–1.0 is recommended. This is a KATAK engineering estimate: no measured effect of a nose fairing on the power coefficient of wind turbines was found, and Crowell recommends a short, blunt nose for subsonic flow.","s":"KATAK engineering estimate based on the nose shapes of G. A. Crowell, The Descriptive Geometry of Nose Cones, 1996."},
  nose_gap_mm: {"d":"The distance from the fairing base to the rotor nose. The front bearing stand sits in this gap.","v":"The fairing base is flat and the stand sits behind it: the drag of the flat base and of the stand exceeds the difference between the fairing profiles. A profile that meets its base tangentially helps aerodynamically only when the base almost touches the hub.","o":"Choose the smallest distance that leaves room for the front bearing stand; the field accepts 10–100 mm.","s":"KATAK engineering estimate; the role of skin friction and shape discontinuities after G. A. Crowell, The Descriptive Geometry of Nose Cones, 1996."},
};
// ---- INFO-END
let lang = 'ru';
try { lang = localStorage.getItem('katak-lang') || (navigator.language || '').slice(0, 2); } catch { lang = (navigator.language || '').slice(0, 2); }
if (!I18N[lang]) lang = 'en';
const T = () => I18N[lang];
const fmt = (x, d = 0) => new Intl.NumberFormat(lang, { maximumFractionDigits: d, minimumFractionDigits: d }).format(x);
const unit = (u) => T().u[u] ?? u;
// plural forms: ru — 1 линия · 2–4 линии · 5+ линий (Intl.PluralRules one / few / many); en — 1 line · lines
const plural = (n, forms) => { const r = new Intl.PluralRules(lang).select(n); return forms[r === 'one' ? 0 : r === 'few' ? 1 : lang === 'ru' ? 2 : 1]; };

// ---- the form, built from FIELDS
const state = {};
function buildForms() {
  for (const box of document.querySelectorAll('[data-form]')) box.innerHTML = '';
  for (const [id, form, type, def, o] of FIELDS) {
    const box = document.querySelector(`[data-form="${form}"]`);
    const wrap = document.createElement('div');
    wrap.className = 'field' + (type === 'auto' ? ' auto' : ''); wrap.dataset.id = id;
    const lab = document.createElement('label'); lab.htmlFor = 'in-' + id;
    lab.innerHTML = `${T().f[id] ?? id}${o.unit ? ` <span class="unit">${unit(o.unit)}</span>` : ''}`;
    // the (i) button sits beside the label, outside it: a click on it must not focus the input (ideas/07)
    const row = document.createElement('div'); row.className = 'lab';
    const ib = document.createElement('button'); ib.type = 'button'; ib.className = 'info'; ib.textContent = 'i'; ib.dataset.info = id;
    ib.setAttribute('aria-label', `${T().r.infoBtn}: ${T().f[id] ?? id}`); ib.setAttribute('aria-expanded', 'false');
    row.append(ib, lab);
    let input;
    if (type === 'sel') {
      input = document.createElement('select');
      for (const v of o.opts) { const op = document.createElement('option'); op.value = v; op.textContent = T().o[v] ?? v; input.append(op); }
    } else {
      input = document.createElement('input'); input.type = 'number'; input.min = o.min; input.max = o.max; input.step = o.step;
      if (type === 'auto') input.placeholder = T().auto;
    }
    input.id = 'in-' + id;
    input.value = state[id] ?? def;
    input.addEventListener('input', () => { state[id] = input.value; schedule(); });
    wrap.append(row, input);
    if (T().h[id]) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = T().h[id]; wrap.append(h); }
    box.append(wrap);
  }
}
// ---- the (i) popup (ideas/07): one shared element; a mouse hover or keyboard focus opens it beside the button, a click or a
// tap pins it, Esc / a tap elsewhere / leaving the button and the popup closes it. Content: T().info[id] = { d, v, o, s };
// a field without a text yet shows its hint. [NOT-TESTED]
const infoPop = $('#info-pop');
let infoBtn = null, infoPinned = false, infoTimer = null;
function infoShow(btn) {
  clearTimeout(infoTimer);
  if (infoBtn && infoBtn !== btn) infoBtn.setAttribute('aria-expanded', 'false');
  const id = btn.dataset.info, t = T(), x = (t.info || {})[id], esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const rows = x ? [[t.r.infoD, x.d], [t.r.infoV, x.v], [t.r.infoO, x.o], [t.r.infoS, x.s]].filter(([, v]) => v) : [[t.r.infoD, t.h[id] || '—']];
  infoPop.innerHTML = `<h4>${esc(t.f[id] ?? id)}</h4><dl>${rows.map(([k, v]) => `<div class="sec"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
  infoPop.hidden = false; infoBtn = btn; btn.setAttribute('aria-expanded', 'true');
  // window coordinates (the popup is position: fixed): below the button; else above it; else as low as it fits — never past
  // the window's edge, so the page never has to be scrolled to read it
  const b = btn.getBoundingClientRect(), w = infoPop.offsetWidth, h = infoPop.offsetHeight, pad = 12;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const left = Math.max(pad, Math.min(b.left, vw - w - pad));
  let top = b.bottom + 6;
  if (top + h > vh - pad) top = b.top - 6 - h >= pad ? b.top - 6 - h : Math.max(pad, vh - pad - h);
  infoPop.style.left = `${left}px`; infoPop.style.top = `${top}px`;
}
function infoHide() { infoPop.hidden = true; infoPinned = false; if (infoBtn) infoBtn.setAttribute('aria-expanded', 'false'); infoBtn = null; }
const infoLater = () => { if (!infoPinned) { clearTimeout(infoTimer); infoTimer = setTimeout(infoHide, 180); } };
document.addEventListener('pointerover', (e) => { const b = e.target.closest && e.target.closest('.info'); if (b && e.pointerType === 'mouse' && !infoPinned) infoShow(b); });
document.addEventListener('pointerout', (e) => { const b = e.target.closest && e.target.closest('.info'); if (b && e.pointerType === 'mouse') infoLater(); });
infoPop.addEventListener('pointerenter', () => clearTimeout(infoTimer));
infoPop.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') infoLater(); });
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('.info');
  if (b) { if (infoPinned && infoBtn === b) infoHide(); else { infoShow(b); infoPinned = true; } return; }
  if (!infoPop.hidden && !infoPop.contains(e.target)) infoHide();
});
document.addEventListener('focusin', (e) => { if (e.target.classList && e.target.classList.contains('info') && !infoPinned) infoShow(e.target); });
document.addEventListener('focusout', (e) => { if (e.target.classList && e.target.classList.contains('info')) infoLater(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !infoPop.hidden) infoHide(); });
// the popup is fixed to the window: a scrolled page moves its button away — a hover popup closes, a pinned one follows
addEventListener('scroll', () => { if (infoPop.hidden) return; if (infoPinned && infoBtn) { const b = infoBtn; infoShow(b); infoPinned = true; } else infoHide(); }, { passive: true });

const num = (id) => { const v = state[id] ?? FIELDS.find((f) => f[0] === id)[3]; return v === '' || v == null ? null : Number(v); };
const str = (id) => String(state[id] ?? FIELDS.find((f) => f[0] === id)[3]);

function applyI18n() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) { const v = T()[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; }
  document.title = 'KATAK — ' + T().title;
  buildForms();
  showModeFields();
}
function showModeFields() {
  const vis = (id, on) => { const el = document.querySelector(`.field[data-id="${id}"]`); if (el) el.hidden = !on; };
  const byPower = str('mode') === 'power';
  vis('diameter_mm', !byPower); vis('target_w', byPower); vis('target_v', byPower);
  vis('alpha_deg', str('angle_mode') === 'fixed');
  const b = str('bore'); vis('bearing', b === 'bearings'); vis('bore_kind', b !== 'bearings');
  vis('tie_mm', num('ties') > 0);
  const nose = str('nose') === 'yes'; vis('nose_shape', nose); vis('nose_ratio', nose); vis('nose_gap_mm', nose);
}

// ---- the calculation
let last = null;
function compute() {
  const s = { ...KATAK.SITE_DEFAULTS };
  for (const k of ['v_ref', 'z_ref', 'height_m', 'alt_m', 'temp_c', 'weibull_k']) s[k] = num(k);
  s.terrain = str('terrain'); s.site = str('site'); s.material = str('material'); s.cp_preset = str('cp_preset');
  let D = num('diameter_mm'), powerNote = null;
  if (str('mode') === 'power') { D = Math.round(Math.min(1500, Math.max(100, KATAK.diameterForPower(num('target_w'), num('target_v'), s))) / 10) * 10; powerNote = D; }
  const g = {
    diameter_mm: D, blades: Number(str('blades')), turns: num('turns'), angle_mode: str('angle_mode'), alpha_deg: num('alpha_deg'),
    ld: num('ld'), hub_ratio: num('hub_ratio'), hand: Number(str('hand')),
    nozzle_mm: Number(str('nozzle_mm')), layer_mm: num('layer_mm'), wall_mm: num('wall_mm'), detail: num('detail'),
    bore: str('bore'), bore_kind: str('bore_kind'), ties: num('ties'), tie_mm: num('tie_mm'),
    rim: str('rim') === 'auto' ? D >= 400 : str('rim') === 'yes', nose: str('nose') === 'yes', nose_shape: str('nose_shape'),
    nose_ratio: num('nose_ratio'), nose_gap_mm: num('nose_gap_mm'),
  };

  viewer.show(b.r, last);
  render();
  $('#build-info').textContent = `${fmt(b.r.parts.rotor.f.length)} △ · ${Math.round(performance.now() - t0)} ms`;
}
// the parts table of the print from parts: name · quantity · size · one STL button per part (one skirt file printed N times)
function renderParts() {
  const box = $('#parts'), sp = last.split, t = T();
  if (!sp) { box.hidden = true; box.innerHTML = ''; return; }
  const name = (q) => q.kind === 'floor' ? t.r.floor.replace('{i}', q.index).replace('{n}', q.of) : t.r.skirt;
  box.hidden = false;
  box.innerHTML = `<h3>${t.r.parts}</h3><table class="spec"><tr><td>${t.r.part}</td><td>${t.r.count}</td><td>${t.r.size}</td><td></td></tr>` +
    sp.parts.map((q) => `<tr><td>${name(q)}</td><td>${q.count}</td><td>${q.size.map((x) => fmt(x)).join(' × ')}</td><td><button class="btn secondary" type="button" data-part="${q.id}">STL</button></td></tr>`).join('') + '</table>';
  for (const btn of box.querySelectorAll('[data-part]')) btn.addEventListener('click', () => downloadPart(btn.dataset.part));
}
function downloadPart(id) {
  const q = last.split && last.split.parts.find((x) => x.id === id); if (!q) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([KATAK.toSTL(q.mesh, id)], { type: 'model/stl' }));
  a.download = `katak-${id}-${last.g.diameter_mm}mm${q.count > 1 ? `-x${q.count}` : ''}.stl`;
  document.body.append(a); a.click(); a.remove();
  $('#build-info').textContent = `${id}: ${fmt(q.mesh.f.length)} △ · ${a.download}`;
}
function download(part) {
  const b = buildParts(last.g.detail);
  const m = b.r.parts[part]; if (!m) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([KATAK.toSTL(m, part)], { type: 'model/stl' }));
  a.download = `katak-${part}-${b.r.params.diameter_mm}mm-${b.r.wall.lines}x${b.r.params.nozzle_mm}.stl`;
  document.body.append(a); a.click(); a.remove();
  $('#build-info').textContent = `${part}: ${fmt(m.f.length)} △ · ${a.download}`;
}

// ---- the WebGL view of the installation (researches/03 §3, ideas/04): the axis HORIZONTAL (world X), the rotor on a fixed
// axle, the front bearing stand in the gap, the nose fairing ahead of the stand, the generator and its stand behind, a base beam.
const viewer = (() => {
  const cv = $('#view'), gl = cv.getContext('webgl', { antialias: true });
  if (!gl) return { show() {} };
  const vs = `attribute vec3 p; attribute vec3 n; uniform mat4 mvp; uniform mat3 nm; varying vec3 vn; void main(){ vn = nm * n; gl_Position = mvp * vec4(p, 1.0); }`;
  const fs = `precision mediump float; varying vec3 vn; uniform vec3 col; void main(){ vec3 l = normalize(vec3(0.4, 0.6, 0.7)); float d = abs(dot(normalize(vn), l)); gl_FragColor = vec4(col * (0.28 + 0.72 * d), 1.0); }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
  const loc = { p: gl.getAttribLocation(prog, 'p'), n: gl.getAttribLocation(prog, 'n'), mvp: gl.getUniformLocation(prog, 'mvp'), nm: gl.getUniformLocation(prog, 'nm'), col: gl.getUniformLocation(prog, 'col') };
  let parts = [], centre = [0, 0, 0], radius = 100, yaw = -2.2, pitch = 0.3, zoom = 1;
  const upload = (m, xf, col) => {
    const pos = new Float32Array(m.f.length * 9), nor = new Float32Array(m.f.length * 9);
    let o = 0; const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    for (const [a, b, c] of m.f) {
      const A = xf(m.v[a]), B = xf(m.v[b]), C = xf(m.v[c]);
      const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], v = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
      const nn = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      for (const P of [A, B, C]) { pos.set(P, o); nor.set(nn, o); o += 3; for (let i = 0; i < 3; i++) { lo[i] = Math.min(lo[i], P[i]); hi[i] = Math.max(hi[i], P[i]); } }
    }
    const bp = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bp); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
    const bn = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bn); gl.bufferData(gl.ARRAY_BUFFER, nor, gl.STATIC_DRAW);
    return { bp, bn, count: m.f.length * 3, col, lo, hi };
  };
  function show(r, st) {
    for (const q of parts) { gl.deleteBuffer(q.bp); gl.deleteBuffer(q.bn); }
    const P = KATAK._, p = r.params, D = p.diameter_mm, R = D / 2, Ls = r.dims.Ls;
    // the frame after the original's «Side View» (owner 2026-11-16 18:53 «форма кронштейна не такая, как я тебе в прошюре скидывал»):
    // a V — the yawing post with
    // a flange under the front end; from its top a short arm to the front bearing housing and a long arm that runs under the
    // rotor below its largest radius and rises behind the exit to the generator — with the axle they make the triangle. [NOT-TESTED]
    const zDeck = -(R + 0.05 * D), ground = zDeck - 0.22 * D;
    const axD = p.bore === 'bearings' ? st.bearing.d : p.bore_mm, gap = p.nose_gap_mm;
    const xStand = -p.hub_front_mm - gap / 2, xNose = -p.hub_front_mm - gap, xGen = Ls + p.hub_back_mm + 6, genL = 0.18 * D, genD = Math.max(0.22 * D, st.bearing.D + 16);
    const axis = (dx = 0) => (q) => [q[2] + dx, q[0], q[1]];                 // a part built along z → world X
    const up = (dx) => (q) => [q[0] + dx, q[1], q[2] + ground];               // a post built along z → world Z, from the ground
    parts = [];
    parts.push(upload(r.parts.rotor, (q) => [q[2] - r.lift_mm, q[0], q[1]], [1.0, 0.10, 0.55]));
    parts.push(upload(P.prism('round', axD, xNose - 4, xGen + genL + 12, 24), axis(), [0.66, 0.68, 0.72]));
    const hous = Math.min(gap - 6, st.bearing.B + 6);
    parts.push(upload(P.prism('round', st.bearing.D + 8, xStand - hous / 2, xStand + hous / 2, 32), axis(), [0.32, 0.26, 0.30]));
    parts.push(upload(P.prism('round', genD, xGen, xGen + genL, 40), axis(), [0.22, 0.20, 0.22]));
    const frameCol = [0.20, 0.20, 0.23], tubeR = Math.max(5, 0.026 * D), postR = 1.4 * tubeR, id = (q) => q;
    const xDeck = 0.45 * Ls, xRear = xGen + genL / 2, rc = Math.max(4, Math.min(0.12 * D, xRear - Ls - 2));
    parts.push(upload(P.prism('round', 2 * postR, 0, zDeck - ground, 24), up(xDeck), frameCol));                 // the yawing post
    parts.push(upload(P.prism('round', 7 * postR, 0, 4, 32), up(xDeck), frameCol));                              // its flange
    parts.push(upload(P.sweepTube([[xDeck, 0, zDeck], [xStand, 0, -(st.bearing.D + 8) / 2]], tubeR, 4), id, frameCol));   // short arm
    const arm = [[xDeck, 0, zDeck], [xRear - rc, 0, zDeck]];
    for (let i = 1; i <= 8; i++) { const f = Math.PI / 2 * i / 8; arm.push([xRear - rc + rc * Math.sin(f), 0, zDeck + rc - rc * Math.cos(f)]); }
    arm.push([xRear, 0, -genD / 2]);
    parts.push(upload(P.sweepTube(arm, tubeR, 4), id, frameCol));                                                // long arm
    if (r.parts.nose) parts.push(upload(r.parts.nose, (q) => [xNose - q[2], q[0], q[1]], [0.96, 0.86, 0.92]));
    const lo = [0, 1, 2].map((i) => Math.min(...parts.map((q) => q.lo[i]))), hi = [0, 1, 2].map((i) => Math.max(...parts.map((q) => q.hi[i])));
    centre = lo.map((x, i) => (x + hi[i]) / 2); radius = Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) * 0.62;
    draw();
  }
  function mat4mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }
  function draw() {
    const w = cv.clientWidth * devicePixelRatio, h = cv.clientHeight * devicePixelRatio;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
    gl.useProgram(prog);
    const dist = radius * 3 * zoom;
    const eye = [centre[0] + dist * Math.cos(pitch) * Math.cos(yaw), centre[1] + dist * Math.cos(pitch) * Math.sin(yaw), centre[2] + dist * Math.sin(pitch)];
    const f = [centre[0] - eye[0], centre[1] - eye[1], centre[2] - eye[2]]; const fl = Math.hypot(...f); f.forEach((x, i) => (f[i] = x / fl));
    let s = [f[1], -f[0], 0]; const sl = Math.hypot(...s) || 1; s = s.map((x) => x / sl);
    const u = [s[1] * f[2] - s[2] * f[1], s[2] * f[0] - s[0] * f[2], s[0] * f[1] - s[1] * f[0]];
    const view = new Float32Array([s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0,
      -(s[0] * eye[0] + s[1] * eye[1] + s[2] * eye[2]), -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]), f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2], 1]);
    const asp = w / h, fov = 0.6, near = dist * 0.05, far = dist * 4, t = 1 / Math.tan(fov / 2);
    const proj = new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0]);
    gl.uniformMatrix4fv(loc.mvp, false, mat4mul(proj, view));
    gl.uniformMatrix3fv(loc.nm, false, new Float32Array([view[0], view[1], view[2], view[4], view[5], view[6], view[8], view[9], view[10]]));
    for (const q of parts) {
      gl.uniform3fv(loc.col, q.col);
      gl.bindBuffer(gl.ARRAY_BUFFER, q.bp); gl.enableVertexAttribArray(loc.p); gl.vertexAttribPointer(loc.p, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, q.bn); gl.enableVertexAttribArray(loc.n); gl.vertexAttribPointer(loc.n, 3, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, q.count);
    }
  }
  let drag = null;
  cv.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.01; pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - drag[1]) * 0.01)); drag = [e.clientX, e.clientY]; draw(); });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.3, Math.min(3, zoom * (e.deltaY > 0 ? 1.1 : 0.9))); draw(); }, { passive: false });
  addEventListener('resize', draw);
  return { show };
})();
