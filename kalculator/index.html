<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KATAK — калькулятор турбины Архимеда</title>
<link rel="icon" type="image/svg+xml" href="../design/icon/katak-icon-d5-21.svg">
<style>
/* Layout: desktop first — a procedure sheet like the KEINKT Calibrator (researches/03 §1): a header with the language at the
   top right, an intro with fact cards, a step navigation, then steps as bands — inputs on the left, what they give on the
   right; one column on a phone. Palette: the classic Krinik acid pink on near-black (GOAL.md). [NOT-TESTED] */
:root {
  --bg: #0D0D0D; --surface: #171217; --surface2: #1F161D; --ink: #F4EEF2; --muted: #A99AA3; --rule: #3A2633;
  --accent: #FF1A8C; --accent2: #FF5FB0; --accent-ink: #FFFFFF; --glow: #2A0A1C;
  --ok: #4ADE80; --warn: #FBBF24; --bad: #FF6B6B;
  --display: "Segoe UI Semibold", "Segoe UI", system-ui, sans-serif; --body: "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(1200px 600px at 70% -10%, #2A0A1C 0%, var(--bg) 60%) fixed, var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px max(24px, env(safe-area-inset-left)) 64px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 40px; } h2 { font-size: 24px; } h3 { font-size: 16px; }
p { margin: 0; max-width: 70ch; }
a { color: var(--accent2); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand img { width: 64px; height: 64px; filter: drop-shadow(0 0 12px rgba(255, 26, 140, .45)); }
.mark { font: 700 14px var(--display); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.lang { display: flex; align-items: center; gap: 8px; }
.lang select, .field select, .field input { font: 15px var(--body); padding: 8px 10px; border: 1px solid var(--rule); background: var(--surface2); color: var(--ink); border-radius: 8px; width: 100%; }
.lang select { width: auto; min-width: 150px; font-weight: 600; cursor: pointer; }
.field input:focus, .field select:focus, .lang select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.intro { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 28px; align-items: start; }
.lede { font-size: 18px; color: var(--ink); }
.facts { display: flex; flex-direction: column; gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--muted); }
.fact b { display: block; color: var(--ink); font-family: var(--display); margin-bottom: 2px; }
.steps-nav { display: flex; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--surface); position: sticky; top: 8px; z-index: 5; }
.steps-nav a { flex: 1; padding: 10px 14px; text-decoration: none; color: var(--ink); font-size: 14px; border-right: 1px solid var(--rule); display: flex; gap: 8px; align-items: baseline; }
.steps-nav a:last-child { border-right: 0; }
.steps-nav a b { color: var(--accent); }
.steps-nav a:hover { background: var(--surface2); }
.step { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 24px; display: grid; grid-template-columns: 44px minmax(0, 6fr) minmax(0, 5fr); gap: 16px 24px; scroll-margin-top: 64px; }
.step > .n { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 18px var(--display); box-shadow: 0 0 16px rgba(255, 26, 140, .5); }
.step .text { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.step .side { display: flex; flex-direction: column; gap: 12px; min-width: 0; color: var(--muted); font-size: 14px; }
.step.wide .side { grid-column: 2 / -1; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.field label { color: var(--ink); font-weight: 600; }
.field .hint { color: var(--muted); font-size: 12.5px; }
.field .unit { color: var(--muted); font-weight: 400; }
.field.auto input::placeholder { color: var(--accent2); opacity: .9; }
.btn { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--body); padding: 11px 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 0 14px rgba(255, 26, 140, .35); }
.btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); box-shadow: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface2); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font: 700 24px var(--display); color: var(--ink); }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.kpi .l { font-size: 12.5px; color: var(--muted); }
.kpi.hero { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 18px rgba(255, 26, 140, .25); }
.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; align-items: start; }
.chart { width: 100%; height: auto; background: var(--surface2); border: 1px solid var(--rule); border-radius: 12px; }
.chart text { fill: var(--muted); font: 11px var(--body); }
table.spec { width: 100%; border-collapse: collapse; font-size: 14px; }
table.spec td { padding: 6px 4px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.spec td:last-child { text-align: right; font-family: var(--mono); color: var(--ink); white-space: nowrap; }
table.spec td:first-child { color: var(--muted); }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.notes li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; color: var(--ink); }
.notes li::before { font-weight: 700; }
.notes li.ok::before { content: "✓"; color: var(--ok); }
.notes li.warn::before { content: "!"; color: var(--warn); }
.notes li.bad::before { content: "✕"; color: var(--bad); }
.viewer { position: relative; }
.viewer canvas { width: 100%; height: 520px; display: block; border-radius: 12px; border: 1px solid var(--rule); background: radial-gradient(circle at 50% 40%, #2A0A1C, #0D0D0D 70%); cursor: grab; touch-action: none; }
.viewer .cap { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
.note { font-size: 13px; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--rule); padding-top: 16px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  h1 { font-size: 28px; }
  .wrap { padding: 18px 16px 48px; }
  .top { flex-direction: column; align-items: flex-start; }
  .intro, .grid { grid-template-columns: 1fr; }
  .steps-nav { display: none; }
  .step { grid-template-columns: 1fr; padding: 16px; }
  .step.wide .side { grid-column: auto; }
  .viewer canvas { height: 360px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script type="module">
// ===== CORE-BEGIN (pure functions, no DOM; tested by kalculator/test.mjs) =====
// The KATAK core: geometry of the printable turbine and the binary STL. Units: millimetres in geometry (the STL boundary),
// SI in physics (phase B). Every non-trivial block carries its test status (TESTING_FRAMEWORK.md markers).
const KATAK = (() => {
  const TAU = Math.PI * 2;

  // ---------------------------------------------------------------- vectors
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const unit = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  // ---------------------------------------------------------------- mesh
  // A mesh is { v: [[x,y,z]…], f: [[a,b,c]…] } — one or more CLOSED shells. Shells may overlap: slicers union closed shells
  // (risk (a) of plans/01 — proven by slicing in the run report). [NOT-TESTED]
  const mesh = () => ({ v: [], f: [] });
  function append(dst, src) {
    const o = dst.v.length;
    for (const p of src.v) dst.v.push(p);
    for (const [a, b, c] of src.f) dst.f.push([a + o, b + o, c + o]);
    return dst;
  }
  function signedVolume(m) { let s = 0; for (const [a, b, c] of m.f) s += dot(m.v[a], cross(m.v[b], m.v[c])); return s / 6; }
  // flip a whole shell when it came out inside-out (its signed volume is negative) — shells are built consistently, so
  // one global decision per shell suffices
  function orientOutward(m) { if (signedVolume(m) < 0) for (const f of m.f) { const t = f[1]; f[1] = f[2]; f[2] = t; } return m; }
  // Closedness (2-manifold, consistently oriented): every directed edge a→b occurs once and its reverse b→a occurs once.
  function checkClosed(m) {
    const seen = new Map();
    for (const [a, b, c] of m.f) for (const [p, q] of [[a, b], [b, c], [c, a]]) {
      const k = p + ',' + q; seen.set(k, (seen.get(k) || 0) + 1);
    }
    let open = 0, doubled = 0;
    for (const [k, n] of seen) {
      if (n > 1) doubled++;
      const [p, q] = k.split(','); if (!seen.has(q + ',' + p)) open++;
    }
    return { closed: open === 0 && doubled === 0, open, doubled, triangles: m.f.length };
  }
  function bounds(m) {
    const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    for (const p of m.v) for (let i = 0; i < 3; i++) { if (p[i] < lo[i]) lo[i] = p[i]; if (p[i] > hi[i]) hi[i] = p[i]; }
    return { lo, hi, size: sub(hi, lo) };
  }
  function translate(m, d) { m.v = m.v.map((p) => add(p, d)); return m; }

  // ---------------------------------------------------------------- shells
  // A thick sheet: two grids of the same topology (top, bottom) closed by four side strips. The boundary walk follows the
  // direction the top faces use, so the sides come out consistent (derivation in the commit of this block). [NOT-TESTED]
  function gridSolid(top, bot) {
    const R = top.length, Cn = top[0].length, m = mesh();
    const it = (i, j) => i * Cn + j, ib = (i, j) => R * Cn + i * Cn + j;
    for (const row of top) for (const p of row) m.v.push(p);
    for (const row of bot) for (const p of row) m.v.push(p);
    for (let i = 0; i < R - 1; i++) for (let j = 0; j < Cn - 1; j++) {
      m.f.push([it(i, j), it(i + 1, j), it(i + 1, j + 1)], [it(i, j), it(i + 1, j + 1), it(i, j + 1)]);
      m.f.push([ib(i, j), ib(i + 1, j + 1), ib(i + 1, j)], [ib(i, j), ib(i, j + 1), ib(i + 1, j + 1)]);
    }
    const loop = [];
    for (let i = 0; i < R; i++) loop.push([i, 0]);
    for (let j = 1; j < Cn; j++) loop.push([R - 1, j]);
    for (let i = R - 2; i >= 0; i--) loop.push([i, Cn - 1]);
    for (let j = Cn - 2; j >= 1; j--) loop.push([0, j]);
    for (let k = 0; k < loop.length; k++) {
      const p = loop[k], q = loop[(k + 1) % loop.length];
      const tp = it(...p), tq = it(...q), bp = ib(...p), bq = ib(...q);
      m.f.push([tq, tp, bp], [tq, bp, bq]);
    }
    return orientOutward(m);
  }

  // Profiles of the shaft / bore: the boundary point at polar angle a — every profile sampled at the SAME angles, so an outer
  // and an inner profile pair up vertex by vertex. kinds: round (size = diameter), hex (size = across flats), square (size =
  // side), d (size = diameter, flat at 0.4·r from the centre's edge — the common D-shaft cut of ≈ 0.1·d). [NOT-TESTED]
  function profileRadius(kind, size, a) {
    const r = size / 2;
    if (kind === 'hex') { const ap = r, seg = TAU / 6, x = ((a % seg) + seg) % seg - seg / 2; return ap / Math.cos(x); }
    if (kind === 'square') { const ap = r, seg = TAU / 4, x = ((a % seg) + seg) % seg - seg / 2; return ap / Math.cos(x); }
    if (kind === 'd') { const flat = r * 0.8, c = Math.cos(a); return c > 0 && r * c > flat ? flat / c : r; }
    return r;
  }
  const profileRing = (kind, size, z, n, a0 = 0) =>
    Array.from({ length: n }, (_, i) => { const a = a0 + TAU * i / n, r = profileRadius(kind, size, a); return [r * Math.cos(a), r * Math.sin(a), z]; });

  // A prism of a profile from z0 to z1, optionally with a profiled hole through it. [NOT-TESTED]
  function prism(outerKind, outerSize, z0, z1, n, holeKind = null, holeSize = 0) {
    const m = mesh();
    const ob = profileRing(outerKind, outerSize, z0, n), ot = profileRing(outerKind, outerSize, z1, n);
    const at = (arr) => { const o = m.v.length; for (const p of arr) m.v.push(p); return o; };
    const OB = at(ob), OT = at(ot);
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; m.f.push([OB + i, OB + j, OT + j], [OB + i, OT + j, OT + i]); }
    if (holeKind) {
      const IB = at(profileRing(holeKind, holeSize, z0, n)), IT = at(profileRing(holeKind, holeSize, z1, n));
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        m.f.push([IB + i, IT + j, IB + j], [IB + i, IT + i, IT + j]);                 // inner wall, facing the axis
        m.f.push([OT + i, OT + j, IT + j], [OT + i, IT + j, IT + i]);                 // top annulus
        m.f.push([OB + i, IB + j, OB + j], [OB + i, IB + i, IB + j]);                 // bottom annulus
      }
    } else {
      const cb = at([[0, 0, z0]]), ct = at([[0, 0, z1]]);
      for (let i = 0; i < n; i++) { const j = (i + 1) % n; m.f.push([cb, OB + j, OB + i], [ct, OT + i, OT + j]); }
    }
    return orientOutward(m);
  }

  // A solid of revolution about z from a profile [[r, z]…]: either from pole to pole (first and last r = 0) or a closed loop
  // that never touches the axis. [NOT-TESTED]
  function revolve(profile, n) {
    const m = mesh();
    const pole = (p) => p[0] <= 1e-9;
    const P = profile;
    const openPoles = pole(P[0]) && pole(P[P.length - 1]);
    const rings = [];
    for (let k = 0; k < P.length; k++) {
      if (openPoles && (k === 0 || k === P.length - 1)) { rings.push(m.v.length); m.v.push([0, 0, P[k][1]]); continue; }
      rings.push(m.v.length);
      for (let i = 0; i < n; i++) { const a = TAU * i / n; m.v.push([P[k][0] * Math.cos(a), P[k][0] * Math.sin(a), P[k][1]]); }
    }
    const isPole = (k) => openPoles && (k === 0 || k === P.length - 1);
    const last = openPoles ? P.length - 1 : P.length;
    for (let k = 0; k < last; k++) {
      const k2 = (k + 1) % P.length, A = rings[k], B = rings[k2];
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        if (isPole(k)) m.f.push([A, B + j, B + i]);
        else if (isPole(k2)) m.f.push([A + i, A + j, B]);
        else m.f.push([A + i, A + j, B + j], [A + i, B + j, B + i]);
      }
    }
    return orientOutward(m);
  }

  // A round tube swept along a polyline (ribs) or a closed loop (the rim ring); frames by parallel transport. [NOT-TESTED]
  function sweepTube(path, radius, n, closedLoop = false) {
    const m = mesh(), N = path.length;
    const tan = path.map((p, i) => unit(sub(path[closedLoop ? (i + 1) % N : Math.min(N - 1, i + 1)], path[closedLoop ? (i - 1 + N) % N : Math.max(0, i - 1)])));
    let nrm = unit(cross(tan[0], Math.abs(tan[0][2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
    const rings = [];
    for (let i = 0; i < N; i++) {
      if (i > 0) { const t = tan[i]; nrm = unit(sub(nrm, mul(t, dot(nrm, t)))); }
      const bin = cross(tan[i], nrm), o = m.v.length; rings.push(o);
      for (let k = 0; k < n; k++) { const a = TAU * k / n; m.v.push(add(path[i], add(mul(nrm, radius * Math.cos(a)), mul(bin, radius * Math.sin(a))))); }
    }
    const segs = closedLoop ? N : N - 1;
    for (let i = 0; i < segs; i++) {
      const A = rings[i], B = rings[(i + 1) % N];
      for (let k = 0; k < n; k++) { const l = (k + 1) % n; m.f.push([A + k, B + k, B + l], [A + k, B + l, A + l]); }
    }
    if (!closedLoop) {
      const c0 = m.v.length; m.v.push(path[0]); const c1 = m.v.length; m.v.push(path[N - 1]);
      const A = rings[0], B = rings[N - 1];
      // the caps run AGAINST the side wall's ring edges (side: A+l→A+k at the start, B+k→B+l at the end) — round 1 had them
      // the same way round, and every rib came out open (kalculator/test.mjs: open 144 = 9 ribs × 8 × 2 caps)
      for (let k = 0; k < n; k++) { const l = (k + 1) % n; m.f.push([c0, A + k, A + l], [c1, B + l, B + k]); }

  // ---------------------------------------------------------------- printing (researches/02_3d_printing)
  // Wall of N extrusion lines: spacing = w − h·(1 − π/4) (Slic3r flow math), T(N) = w + (N − 1)·spacing; the requested wall
  // is a MINIMUM — it snaps UP to the next T(N), N ≥ 2 (idea 03, owner: «генерировать удобные толщины»; rounding up is the
  // agent's call [AI]: a wall thinner than asked would be weaker than the user planned). [NOT-TESTED]
  function wallForNozzle({ nozzle_mm = 0.4, layer_mm = null, line_mm = null, wanted_mm = 1.2, minLines = 2 } = {}) {
    const w = line_mm || 1.125 * nozzle_mm;                 // PrusaSlicer default width (researches/02 §1)
    const h = layer_mm || Math.round(0.5 * nozzle_mm / 0.02) * 0.02;   // 50 % of the nozzle (researches/02 §4)
    const spacing = w - h * (1 - Math.PI / 4);
    const T = (N) => w + (N - 1) * spacing;
    const N = Math.max(minLines, Math.ceil((wanted_mm - w) / spacing - 1e-9) + 1);
    return { lines: N, wall_mm: T(N), line_mm: w, layer_mm: h, spacing_mm: spacing, T };
  }

  // ---------------------------------------------------------------- the turbine (researches/01 §6.2, §5.8, §6.8, §7)
  // The rotor's NOSE faces the wind (z = 0); each blade opens from the hub to the exit (z = L_s, radius R). The blade surface is
  // ruled: every meridional section is a straight segment at the opening angle α(u) to the axis (§6.2). [NOT-TESTED]
  const DETAIL = {                       // samples along the wrap × across the blade × around a circle
    low: { along: 48, across: 4, round: 32 },
    medium: { along: 96, across: 6, round: 64 },
    high: { along: 192, across: 10, round: 96 },
    ultra: { along: 384, across: 16, round: 160 },
  };
  // Defaults = researches/01 §7 «Рекомендуемые правила проектирования»; diameter is the user's main input.
  const DEFAULTS = {
    diameter_mm: 300, ld: null, hub_ratio: 0.10, blades: 3, turns: 1.0, hand: 1, p_exp: 1, q_exp: 1,
    angle_mode: 'variable', a1_deg: 30, a2_deg: 45, a3_deg: 60, alpha_deg: 60,
    wall_mm: null,                       // null → t = max(0.8 % of D, 3 lines) (§7), then snapped UP to whole lines
    nozzle_mm: 0.4, layer_mm: null, line_mm: null,
    hub_od_mm: null,                     // null → max(0.1·D, bearing OD + 2·3 lines)
    hub_front_mm: 6, hub_back_mm: 10,
    bore: 'bearings', bore_kind: 'round', bore_mm: 10, bearing_od_mm: 26, bearing_w_mm: 8, fit_mm: 0.1,
    ties: 3, tie_mm: 4, tie_at: 0.7,     // ties between neighbouring turns in `ties` meridional half-planes (§5.8), at tie_at of the span
    rim: false, rim_mm: 4,               // exit ring — only for D ≥ 0.4 m and light (§5.8)
    nose: true, nose_ratio: 0.8, nose_shape: 'ellipse', nose_wall_mm: 2.0, nose_fit_mm: 0.3,

  };
  // The opening angle law α(u): fixed, or piecewise linear through (1/3, α1), (2/3, α2), (1, α3), constant below 1/3 (§6.2).
  function alphaAt(p, u) {
    if (p.angle_mode !== 'variable') return p.alpha_deg * Math.PI / 180;
    const a = [p.a1_deg, p.a2_deg, p.a3_deg];
    const d = u <= 1 / 3 ? a[0] : u <= 2 / 3 ? a[0] + (a[1] - a[0]) * (u - 1 / 3) * 3 : a[1] + (a[2] - a[1]) * (u - 2 / 3) * 3;

  }

  function dims(p, wall) {
    const R = p.diameter_mm / 2, Ls = p.ld * p.diameter_mm, hubOD = p.hub_od_mm, rh = hubOD / 2;
    const u0 = Math.pow(Math.min(0.5, Math.max(2 * wall, 3) / (R - rh)), 1 / p.p_exp);   // the blade starts where it is ≥ 2 walls wide
    return { R, Ls, rh, u0 };
  }
  // The outer edge (§6.2): θ_o = θ_k + h·2π·n_t·u, r_o = r_h + (R − r_h)·u^p, z_o = L_s·u^q; root: z_h = z_o − (r_o − r_h)·cot α(u).
  function bladeSurface(p, d, k, u, v, rRoot) {
    const th = TAU * k / p.blades + p.hand * TAU * p.turns * u;
    const ro = d.rh + (d.R - d.rh) * Math.pow(u, p.p_exp), zo = d.Ls * Math.pow(u, p.q_exp);
    const zh = zo - (ro - d.rh) / Math.tan(alphaAt(p, u));

    const top = [], bot = [], eps = 1e-4, rRoot = d.rh - wall / 2;   // the root sinks half a wall into the hub
    const S = (u, v) => bladeSurface(p, d, k, u, v, rRoot);
    for (let i = 0; i <= det.along; i++) {

        const dv = sub(S(u, Math.min(1, v + eps)), S(u, Math.max(0, v - eps)));

  // Validity (§6.2, checks 1–2): the root must stay downstream of the nose and rise with u; neighbouring blades must keep a gap.
  function checks(p, d, wall) {

      const u = d.u0 + (1 - d.u0) * i / 200, zh = bladeSurface(p, d, 0, u, 0)[2];
      if (zh < prev - 1e-6) { warn.push('root-not-rising'); break; }
      prev = zh; minZh = Math.min(minZh, zh);
    }
    if (minZh < -1e-6) warn.push('root-before-nose');

    const gap = ((d.Ls - (d.R - d.rh) / Math.tan(aMin)) / (p.blades * p.turns)) * Math.sin(aMin);
    if (gap < 3 * wall) warn.push('blades-too-close');

  }
  // The hub: a round tube along the axis. bore = 'bearings' → a round bore with a bearing seat at each end (press fit);
  // 'profile' → a through hole of bore_kind (round / hex / square / d); 'solid' → a printed axle. [NOT-TESTED]
  function hub(p, d, det) {
    const z0 = -p.hub_front_mm, z1 = d.Ls + p.hub_back_mm, R = d.rh;
    if (p.bore === 'solid') return prism(p.bore_kind, 2 * R, z0, z1, det.round);
    if (p.bore === 'profile') return prism('round', 2 * R, z0, z1, det.round, p.bore_kind, p.bore_mm + p.fit_mm);
    const rb = (p.bore_mm + 1.0) / 2;                       // the axle passes the hub freely between the bearings
    const rs = (p.bearing_od_mm - p.fit_mm) / 2, w = p.bearing_w_mm;
    return revolve([[R, z0], [R, z1], [rs, z1], [rs, z1 - w], [rb, z1 - w], [rb, z0 + w], [rs, z0 + w], [rs, z0]], det.round);
  }
  // Ties between neighbouring turns (§5.8, §6.6): in the meridional half-plane θ_p the blades cross as segments (one per
  // blade, at different u). An AXIAL rod (parallel to the axis — it prints upright with no support when the rotor is printed
  // axis-vertical, §5.9) stands at the radius of `tie_at` of the inner segment's span and joins it to the next segment — like
  // the cross ties of the commercial rotor that stop the blades from fluttering against each other.
  // History (2026-11-16): round 1 put one rod at a fixed radius — at n_t = 1 it crossed only ONE blade and was dropped; round 2
  // ran perpendicular to the inner segment — the segments are not parallel (α grows 30° → 52°), the rod headed into the hub
  // and was dropped again; both caught by the render and a dump of the segments, not by the closedness test. [NOT-TESTED]
  function ties(p, d, wall, det) {

    const seg = (u) => {                                     // the blade's line in the half-plane: root → edge, in (r, z)
      const ro = d.rh + (d.R - d.rh) * Math.pow(u, p.p_exp), zo = d.Ls * Math.pow(u, p.q_exp), a = alphaAt(p, u);
      return { u, a, r0: d.rh, z0: zo - (ro - d.rh) / Math.tan(a), r1: ro, z1: zo };
    };

        const zAt = (S) => S.z0 + (r - S.r0) * (S.z1 - S.z0) / (S.r1 - S.r0);
        const z0 = zAt(A) - wall * 0.4, z1 = zAt(B) + wall * 0.4;   // ends sink into both blades but stay inside them (a full wall poked through — render, 2026-11-16)
        const path = []; const nSeg = 6;
        for (let j = 0; j <= nSeg; j++) path.push([r * c, r * s, z0 + (z1 - z0) * j / nSeg]);
        out.push(sweepTube(path, p.tie_mm / 2, Math.max(8, det.round / 4)));

  // The nose (§6.8, idea 01): an ellipsoid / ogive / cone cup over the hub's front end, printed apex up; base radius = hub
  // radius + wall, length = nose_ratio · base diameter. A cup, not sealed — the open base drains condensate (§6.8 p. 3).
  function nose(p, d, det) {

    const shape = (u) => {                                  // u: 0 at the base → 1 at the tip; returns r/Rb  (§6.8 [53])
      if (p.nose_shape === 'cone') return 1 - u;
      if (p.nose_shape === 'ogive') { const L = 1, rho = (1 + L * L) / 2, x = 1 - u; return Math.sqrt(Math.max(0, rho * rho - (L - x) * (L - x))) + 1 - rho; }
      return Math.sqrt(Math.max(0, 1 - u * u));             // ellipsoid
    };

    for (let i = 0; i <= n; i++) { const u = i / n; outer.push([Rb * shape(u), Ln * u]); }
    for (let i = 0; i <= n; i++) { const u = i / n; inner.push([Ri * shape(u), Li * u]); }
    const prof = [...outer.slice().reverse(), ...inner];

  function rim(p, d, det) {

    return sweepTube(loop, p.rim_mm / 2, Math.max(8, det.round / 4), true);
  }

  // Resolve the derived defaults (wall, hub), then build every printable part — meshes in mm, each standing on the bed.
  function resolve(input = {}) {
    const p = { ...DEFAULTS, ...input };
    const wanted = p.wall_mm ?? Math.max(0.008 * p.diameter_mm, 3 * (p.line_mm || 1.125 * p.nozzle_mm));
    const wf = wallForNozzle({ nozzle_mm: p.nozzle_mm, layer_mm: p.layer_mm, line_mm: p.line_mm, wanted_mm: wanted });
    if (p.hub_od_mm == null) p.hub_od_mm = Math.max(p.hub_ratio * p.diameter_mm, (p.bore === 'bearings' ? p.bearing_od_mm : p.bore_mm) + 2 * wf.T(3));
    // L/D: the rule's 0.9 (§7), raised when the blades would pass closer than 3 walls at the smallest opening angle
    // (§6.2 check 2: g = (L_s − (R − r_h)·cot α_min)/(N·n_t) · sin α_min ≥ 3t). First run: 0.9 gave 6.0 mm for 3t = 7.5 mm.
    if (p.ld == null) {
      const aMin = Math.min(...(p.angle_mode === 'variable' ? [p.a1_deg, p.a2_deg, p.a3_deg] : [p.alpha_deg])) * Math.PI / 180;
      const R = p.diameter_mm / 2, rh = p.hub_od_mm / 2;
      const need = ((R - rh) / Math.tan(aMin) + 3 * wf.wall_mm * p.blades * p.turns / Math.sin(aMin)) / p.diameter_mm;
      p.ld = Math.max(p.angle_mode === 'variable' ? 0.9 : 0.8, Math.ceil(need * 100) / 100);

    const rotor = mesh();
    for (let k = 0; k < p.blades; k++) append(rotor, blade(p, d, k, wall, det));
    append(rotor, hub(p, d, det));

    return { params: p, wall: wf, dims: d, checks: checks(p, d, wall), nose: noseInfo && { length_mm: noseInfo.length_mm, base_mm: noseInfo.base_mm }, parts, lift_mm: -lo[2] };
  }

  // ---------------------------------------------------------------- physics (researches/01 §2–§5, SI units)
  // Every constant names its section; [ОЦЕНКА] there = an engineering estimate of the recon, shown to the user as such.
  const RD = 287.05;                                        // J/(kg·K), §3.1
  const NU_AIR = 1.5e-5;                                    // m²/s, §2.4 (Re_D)
  const CP_PRESETS = {                                      // §2.4 «Наборы параметров»
    realistic: { cp: 0.22, lam: 1.8 }, optimistic: { cp: 0.29, lam: 2.1 }, pessimistic: { cp: 0.12, lam: 1.2 },
  };
  const TERRAIN = {                                         // §3.2, z0 (m) per WMO class
    sea: 0.0002, snow: 0.005, open: 0.03, crops: 0.10, scattered: 0.25, park: 0.5, suburb: 1.0, city: 2.0,
  };
  const SITE = { field: 1.0, rural: 0.85, roof_high: 0.6, roof: 0.3, yard: 0.1 };   // §3.5 f_site [ОЦЕНКА]
  const MATERIALS = {                                       // §5.6: ρ g/cm³, σ_Z MPa (across layers — the weak one), HDT °C, outdoor
    ASA: { rho: 1.05, sz: 35, hdt: 100, outdoor: true }, PETG: { rho: 1.25, sz: 39, hdt: 69, outdoor: true },
    ABS: { rho: 1.05, sz: 32, hdt: 87, outdoor: false }, PLA: { rho: 1.24, sz: 35, hdt: 57, outdoor: false },
    PACF: { rho: 1.06, sz: 64, hdt: 194, outdoor: true },
  };

    { id: '608', d: 8, D: 22, B: 7 }, { id: '6000', d: 10, D: 26, B: 8 }, { id: '6001', d: 12, D: 28, B: 8 },
    { id: '6002', d: 15, D: 32, B: 9 }, { id: '6003', d: 17, D: 35, B: 10 }, { id: '6004', d: 20, D: 42, B: 12 },
    { id: '6005', d: 25, D: 47, B: 12 },
  ];
  // Γ(x), Lanczos approximation (g = 7) — for the Weibull scale c = V̄/Γ(1 + 1/k), §3.3
  function gamma(x) {
    const g = 7, C = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
      12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
    if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gamma(1 - x));

  }
  // ISA density with the user's temperature, §3.1: p(h) = 101325·(1 − 0.0065h/288.15)^5.25588, ρ = p/(R_d·T)
  const density = (alt_m, t_c) => 101325 * Math.pow(1 - 0.0065 * alt_m / 288.15, 5.25588) / (RD * (t_c + 273.15));
  // log wind profile, §3.2 (displacement d = 0 for a free mast)
  const windAt = (vRef, zRef, z, z0) => vRef * Math.log(Math.max(z, z0 * 1.01) / z0) / Math.log(zRef / z0);

  // Cp_max and λ_opt of THIS geometry: the preset times the multipliers of §2.4 (exit angle, variable profile, blade count,
  // thickness, Reynolds number, tower). Returns the parts so the page can show where a number came from.
  function rotorModel(p, wall_mm, vHubMean) {
    const pre = CP_PRESETS[p.cp_preset] || CP_PRESETS.realistic;
    const aExit = p.angle_mode === 'variable' ? p.a3_deg : p.alpha_deg;

  // The whole calculation: site → wind at the hub → rotor model → power curve → AEP → rpm, torque → loads → shaft, bearing,
  // stresses, mass. `geo` = the resolved geometry parameters (wall, L/D, hub) from resolve().
  function physics(s, geo) {
    const p = geo.p, wall = geo.wf.wall_mm;
    const D = p.diameter_mm / 1000, R = D / 2, A = Math.PI * R * R;
    const rho = density(s.alt_m, s.temp_c);
    const z0 = TERRAIN[s.terrain] ?? 0.03;
    const vHub = windAt(s.v_ref, s.z_ref, s.height_m, z0);
    const k = s.weibull_k, c = weibullC(vHub, k);

    const eta = (v) => interp(nOf(v) / nRated, 0.15, 1.0, 0.34, 0.80);   // §4.5 η_chain(n/n_rated)
    const pAero = (v) => (v < vIn || v >= vOut ? 0 : Math.min(0.5 * rho * A * Math.pow(Math.min(v, vRated), 3) * cpAt(m, m.lamOpt), Infinity));
    const pEl = (v) => Math.max(0, eta(Math.min(v, vRated)) * pAero(v) - (pAero(v) > 0 ? idle : 0));
    const curve = [];
    for (let v = 0; v <= 25 + 1e-9; v += 0.5) curve.push({ v, pa: pAero(v), pe: pEl(v), f: weibullPdf(v, c, k) });
    let e = 0, dv = 0.1;
    for (let v = dv / 2; v < 40; v += dv) e += pEl(v) * weibullPdf(v, c, k) * dv;
    const fSite = SITE[s.site] ?? 1;
    const meanW = e * fSite, aep = meanW * 8760 / 1000;
    let wind = 0; for (let v = dv / 2; v < 40; v += dv) wind += 0.5 * rho * A * v * v * v * weibullPdf(v, c, k) * dv;
    const pRatedEl = pEl(vRated);

      wall: 'Blade thickness', layer: 'Layer / line width', ld: 'Length / diameter', len: 'Rotor length', hub: 'Hub', gap: 'Gap between turns at the nose',
      size: 'Print size', mass: 'Plastic (rotor + nose)', shaft: 'Steel shaft at least', bearing: 'Bearing', rpmRated: 'rpm at 12.5 m/s',
      run: 'Runaway rpm without load', stress: 'Tip stress at runaway', rho: 'Air density', weibull: 'Weibull c / k',
      wind: 'Wind energy through the rotor', rated: 'Power at 12.5 m/s', cf: 'Capacity factor', nose: 'Nose',
      lines: ['line', 'lines', 'lines'],

    w: {
      ok: 'The geometry passes the checks: the blade root stays behind the nose, the turns do not touch.',
      'root-not-rising': 'The blade root runs backwards — increase length / diameter.', 'root-before-nose': 'The blade root starts before the nose — increase length / diameter.',
      'blades-too-close': 'The turns are too close at the nose — increase length / diameter or reduce the wall.',
      bed: 'The model is larger than the printer bed — print in parts or reduce the diameter.', overhang: 'Overhang at the exit {a}° — over 55°: tree supports needed.',
      material: 'This plastic is not for outdoors (sun, UV) — use ASA for a turbine in the open.', stress: 'At runaway the tip stress exceeds the allowed — an electric brake is needed.',
      thick: 'The wall is thicker than 1.5 % of the diameter — the rotor loses efficiency.', big: 'Rotors over 1 m are printed only as prototypes; production ones are fibreglass.',
      roof: 'On a roof the energy is usually 3× lower than on a mast in a field — already accounted for.', power: 'For {w} W at {v} m/s the rotor needs ≈ {d} mm.',
      shear: 'Wind at the turbine height {v} m/s vs {r} m/s at the measuring height.',
    },
    u: { 'm/s': 'm/s', m: 'm', mm: 'mm', W: 'W', '°C': '°C', '°': '°', rpm: 'rpm', N: 'N', g: 'g', kWh: 'kWh', mNm: 'mN·m', MPa: 'MPa', 'kg/m³': 'kg/m³', Wm: 'W' },
  },

let lang = 'ru';

if (!I18N[lang]) lang = 'en';
const T = () => I18N[lang];
const fmt = (x, d = 0) => new Intl.NumberFormat(lang, { maximumFractionDigits: d, minimumFractionDigits: d }).format(x);
const unit = (u) => T().u[u] ?? u;
// plural forms: ru — 1 линия · 2–4 линии · 5+ линий (Intl.PluralRules one / few / many); en — 1 line · lines
const plural = (n, forms) => { const r = new Intl.PluralRules(lang).select(n); return forms[r === 'one' ? 0 : r === 'few' ? 1 : lang === 'ru' ? 2 : 1]; };

// ---- the form, built from FIELDS
function buildForms() {
  for (const box of document.querySelectorAll('[data-form]')) box.innerHTML = '';
  for (const [id, form, type, def, o] of FIELDS) {
    const box = document.querySelector(`[data-form="${form}"]`);
    const wrap = document.createElement('div');
    wrap.className = 'field' + (type === 'auto' ? ' auto' : ''); wrap.dataset.id = id;
    const lab = document.createElement('label'); lab.htmlFor = 'in-' + id;
    lab.innerHTML = `${T().f[id] ?? id}${o.unit ? ` <span class="unit">${unit(o.unit)}</span>` : ''}`;
    let input;
    if (type === 'sel') {
      input = document.createElement('select');
      for (const v of o.opts) { const op = document.createElement('option'); op.value = v; op.textContent = T().o[v] ?? v; input.append(op); }
    } else {
      input = document.createElement('input'); input.type = 'number'; input.min = o.min; input.max = o.max; input.step = o.step;
      if (type === 'auto') input.placeholder = T().auto;
    }
    input.id = 'in-' + id;
    input.value = state[id] ?? def;
    input.addEventListener('input', () => { state[id] = input.value; schedule(); });
    wrap.append(lab, input);
    if (T().h[id]) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = T().h[id]; wrap.append(h); }
    box.append(wrap);
  }
}
const state = {};
const num = (id) => { const v = state[id] ?? FIELDS.find((f) => f[0] === id)[3]; return v === '' || v == null ? null : Number(v); };
const str = (id) => String(state[id] ?? FIELDS.find((f) => f[0] === id)[3]);

function applyI18n() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) { const v = T()[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; }
  document.title = 'KATAK — ' + T().title;
  buildForms();
  showModeFields();
}
function showModeFields() {
  const vis = (id, on) => { const el = document.querySelector(`.field[data-id="${id}"]`); if (el) el.hidden = !on; };
  const byPower = str('mode') === 'power';
  vis('diameter_mm', !byPower); vis('target_w', byPower); vis('target_v', byPower);
  vis('alpha_deg', str('angle_mode') === 'fixed');
  const b = str('bore'); vis('bearing', b === 'bearings'); vis('bore_kind', b !== 'bearings');
  const nose = str('nose') === 'yes'; vis('nose_shape', nose); vis('nose_ratio', nose);
}

// ---- the calculation
let last = null;
function compute() {
  const s = { ...KATAK.SITE_DEFAULTS };
  for (const k of ['v_ref', 'z_ref', 'height_m', 'alt_m', 'temp_c', 'weibull_k']) s[k] = num(k);
  s.terrain = str('terrain'); s.site = str('site'); s.material = str('material'); s.cp_preset = str('cp_preset');
  let D = num('diameter_mm');
  let powerNote = null;
  if (str('mode') === 'power') { D = Math.round(Math.min(1500, Math.max(100, KATAK.diameterForPower(num('target_w'), num('target_v'), s))) / 10) * 10; powerNote = D; }
  const g = {
    diameter_mm: D, blades: Number(str('blades')), turns: num('turns'), angle_mode: str('angle_mode'), alpha_deg: num('alpha_deg'),
    ld: num('ld'), hub_ratio: num('hub_ratio'), hand: Number(str('hand')),
    nozzle_mm: Number(str('nozzle_mm')), layer_mm: num('layer_mm'), wall_mm: num('wall_mm'), detail: str('detail'),
    bore: str('bore'), bore_kind: str('bore_kind'), ties: num('ties'), tie_mm: num('tie_mm'),
    rim: str('rim') === 'auto' ? D >= 400 : str('rim') === 'yes', nose: str('nose') === 'yes', nose_shape: str('nose_shape'), nose_ratio: num('nose_ratio'),
  };
  // first pass → the steel shaft and the bearing it needs; the bearing then shapes the hub (its seats and outer diameter)
  let geo = KATAK.resolve(g), ph = KATAK.physics(s, geo);
  const pick = str('bearing') === 'auto' ? ph.shaft.bearing : KATAK.BEARINGS.find((b) => b.id === str('bearing'));
  if (g.bore === 'bearings') Object.assign(g, { bore_mm: pick.d, bearing_od_mm: pick.D, bearing_w_mm: pick.B });
  else g.bore_mm = num('bore_mm') ?? pick.d;
  geo = KATAK.resolve(g); ph = KATAK.physics(s, geo);
  last = { s, g, geo, ph, bearing: pick, powerNote };
  render();
  schedulePreview();
}

// ---- the result
function kpi(v, u, l, hero = false) { return `<div class="kpi${hero ? ' hero' : ''}"><span class="v">${v}<small>${u}</small></span><span class="l">${l}</span></div>`; }
function rows(list) { return list.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join(''); }
function render() {
  const { s, geo, ph, bearing } = last, p = geo.p, t = T(), m = ph.model;
  $('#kpis').innerHTML = [
    kpi(fmt(ph.meanW, ph.meanW < 10 ? 2 : 1), unit('W'), t.k.meanW, true), kpi(fmt(ph.aep, ph.aep < 10 ? 1 : 0), unit('kWh'), t.k.aep, true),
    kpi(fmt(ph.vHub, 1), unit('m/s'), t.k.vHub), kpi(fmt(ph.rpm.mean), unit('rpm'), t.k.rpm),
    kpi(fmt(m.cpMax, 3), '', t.k.cp), kpi(fmt(m.lamOpt, 2), '', t.k.lam),
    kpi(fmt(ph.torque.start * 1000, 1), unit('mNm'), t.k.start), kpi(fmt(ph.loads.park), unit('N'), t.k.park),
  ].join('');
  const d = geo.p, R = d.diameter_mm;
  $('#geo-spec').innerHTML = rows([
    [t.r.ld, fmt(p.ld, 2)], [t.r.len, `${fmt(p.ld * R)} ${unit('mm')}`], [t.r.hub, `${fmt(p.hub_od_mm, 1)} ${unit('mm')}`],
    [t.r.rho, `${fmt(ph.rho, 3)} ${unit('kg/m³')}`], [t.r.weibull, `${fmt(ph.c, 2)} / ${fmt(ph.k, 1)}`],
  ]);
  $('#print-spec').innerHTML = rows([
    [t.r.wall, `${fmt(geo.wf.wall_mm, 2)} ${unit('mm')} = ${geo.wf.lines} ${plural(geo.wf.lines, t.r.lines)}`],
    [t.r.layer, `${fmt(geo.wf.layer_mm, 2)} / ${fmt(geo.wf.line_mm, 2)} ${unit('mm')}`],
    [t.r.bearing, p.bore === 'bearings' ? `${bearing.id} · ${bearing.d}×${bearing.D}×${bearing.B} ${unit('mm')}` : '—'],
  ]);
  const extra = [
    [t.r.wind, `${fmt(ph.windMeanW, 1)} ${unit('W')}`], [t.r.rated, `${fmt(ph.pRatedEl, 1)} ${unit('W')}`], [t.r.cf, `${fmt(ph.cf * 100, 1)} %`],
    [t.r.rpmRated, `${fmt(ph.rpm.rated)} ${unit('rpm')}`], [t.r.run, `${fmt(ph.rpm.run)} ${unit('rpm')}`],
    [t.r.shaft, `${fmt(ph.shaft.d_mm, 1)} ${unit('mm')}`], [t.r.bearing, `${ph.shaft.bearing.id}`],
    [t.r.stress, `${fmt(ph.stress.sigmaRing, 1)} / ${fmt(ph.stress.allow, 1)} ${unit('MPa')}`],
  ];
  if (last.build) {
    const b = last.build;
    extra.push([t.r.size, `${b.size.map((x) => fmt(x)).join(' × ')} ${unit('mm')}`], [t.r.mass, `${fmt(b.mass)} ${unit('g')}`]);
    if (b.nose) extra.push([t.r.nose, `⌀${fmt(b.nose.base_mm, 1)} × ${fmt(b.nose.length_mm, 1)} ${unit('mm')}`]);
  }
  $('#res-spec').innerHTML = rows(extra);
  renderWarnings();
  renderChart();
}
function renderWarnings() {
  const { s, geo, ph, powerNote } = last, t = T(), p = geo.p, list = [];
  const fill = (str, o) => str.replace(/\{(\w+)\}/g, (_, k) => o[k]);
  if (powerNote) list.push(['ok', fill(t.w.power, { w: fmt(num('target_w'), 1), v: fmt(num('target_v'), 1), d: fmt(powerNote) })]);
  list.push(['ok', fill(t.w.shear, { v: fmt(ph.vHub, 1), r: fmt(s.v_ref, 1) })]);
  const cw = geo.p && last.checks;
  for (const w of (last.checks || [])) list.push(['bad', t.w[w] || w]);
  if (!(last.checks || []).length) list.push(['ok', t.w.ok]);
  const aExit = p.angle_mode === 'variable' ? 60 : p.alpha_deg;
  if (aExit > 55) list.push(['warn', fill(t.w.overhang, { a: fmt(aExit) })]);
  if (!ph.material.outdoor) list.push(['warn', t.w.material]);
  if (!ph.stress.ok) list.push(['warn', t.w.stress]);
  if (geo.wf.wall_mm / p.diameter_mm > 0.015) list.push(['warn', t.w.thick]);
  if (p.diameter_mm > 1000) list.push(['warn', t.w.big]);
  if (s.site === 'roof' || s.site === 'yard') list.push(['warn', t.w.roof]);
  if (last.build && Math.max(...last.build.size) > num('bed_mm')) list.push(['bad', t.w.bed]);
  $('#warnings').innerHTML = list.map(([c, txt]) => `<li class="${c}">${txt}</li>`).join('');
}
function renderChart() {
  const { ph } = last, W = 640, H = 300, L = 46, B = 30, top = 14, right = 14;
  const vMax = 20, pts = ph.curve.filter((c) => c.v <= vMax);
  const pMax = Math.max(1e-3, ...pts.map((c) => c.pe)), fMax = Math.max(...pts.map((c) => c.f));
  const x = (v) => L + (W - L - right) * v / vMax, y = (pw) => H - B - (H - B - top) * pw / (pMax * 1.1);
  let svg = '';
  for (const c of pts) { const h = (H - B - top) * 0.9 * c.f / fMax; svg += `<rect x="${x(c.v) - 6}" y="${H - B - h}" width="12" height="${h}" fill="#FF5FB0" opacity=".22"/>`; }
  svg += `<path d="${pts.map((c, i) => `${i ? 'L' : 'M'}${x(c.v).toFixed(1)} ${y(c.pe).toFixed(1)}`).join(' ')}" fill="none" stroke="#FF1A8C" stroke-width="3"/>`;
  for (let v = 0; v <= vMax; v += 5) svg += `<line x1="${x(v)}" y1="${H - B}" x2="${x(v)}" y2="${top}" stroke="#3A2633"/><text x="${x(v)}" y="${H - 10}" text-anchor="middle">${v}</text>`;
  for (let i = 0; i <= 4; i++) { const pw = pMax * 1.1 * i / 4; svg += `<text x="${L - 6}" y="${y(pw) + 4}" text-anchor="end">${fmt(pw, pMax < 10 ? 1 : 0)}</text>`; }
  svg += `<line x1="${x(ph.vHub)}" y1="${top}" x2="${x(ph.vHub)}" y2="${H - B}" stroke="#F4EEF2" stroke-dasharray="4 4"/>`;
  svg += `<text x="${W - right}" y="${H - B - 6}" text-anchor="end">${unit('m/s')}</text><text x="${L}" y="${top + 2}">${unit('W')}</text>`;
  $('#chart').innerHTML = svg;
}

// ---- geometry: a quick preview build, the full build for the files
let timer = null, ptimer = null;
function schedule() { showModeFields(); clearTimeout(timer); timer = setTimeout(compute, 120); }
function schedulePreview() { clearTimeout(ptimer); ptimer = setTimeout(preview, 200); }
function buildParts(detail) {
  const r = KATAK.build({ ...last.g, detail });
  const mat = KATAK.MATERIALS[last.s.material] || KATAK.MATERIALS.ASA;
  const vol = KATAK.signedVolume(r.parts.rotor) + (r.parts.nose ? KATAK.signedVolume(r.parts.nose) : 0);
  return { r, size: KATAK.bounds(r.parts.rotor).size, mass: vol / 1000 * mat.rho, nose: r.nose };
}
function preview() {
  const t0 = performance.now();
  const b = buildParts('low');
  last.build = b; last.checks = b.r.checks.warn;
  viewer.show(b.r.parts.rotor, b.r.parts.nose, b.r);
  render();
  $('#build-info').textContent = `${fmt(b.r.parts.rotor.f.length)} △ · ${Math.round(performance.now() - t0)} ms`;
}
function download(part) {
  const b = buildParts(last.g.detail);
  const m = b.r.parts[part]; if (!m) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([KATAK.toSTL(m, part)], { type: 'model/stl' }));
  a.download = `katak-${part}-${b.r.params.diameter_mm}mm-${b.r.wall.lines}x${b.r.params.nozzle_mm}.stl`;
  document.body.append(a); a.click(); a.remove();
  $('#build-info').textContent = `${part}: ${fmt(m.f.length)} △ · ${a.download}`;
}

// ---- the WebGL preview (researches/03 §3): flat-shaded triangles, an orbit camera around the rotor's axis
const viewer = (() => {
  const cv = $('#view'), gl = cv.getContext('webgl', { antialias: true });
  if (!gl) return { show() {} };
  const vs = `attribute vec3 p; attribute vec3 n; uniform mat4 mvp; uniform mat3 nm; varying vec3 vn; void main(){ vn = nm * n; gl_Position = mvp * vec4(p, 1.0); }`;
  const fs = `precision mediump float; varying vec3 vn; uniform vec3 col; void main(){ vec3 l = normalize(vec3(0.4, 0.6, 0.7)); float d = abs(dot(normalize(vn), l)); gl_FragColor = vec4(col * (0.28 + 0.72 * d), 1.0); }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
  const loc = { p: gl.getAttribLocation(prog, 'p'), n: gl.getAttribLocation(prog, 'n'), mvp: gl.getUniformLocation(prog, 'mvp'), nm: gl.getUniformLocation(prog, 'nm'), col: gl.getUniformLocation(prog, 'col') };
  let parts = [], centre = [0, 0, 0], radius = 100, yaw = 0.7, pitch = 0.35, zoom = 1;
  const upload = (m, xf) => {
    const pos = new Float32Array(m.f.length * 9), nor = new Float32Array(m.f.length * 9);
    let o = 0;
    for (const [a, b, c] of m.f) {
      const A = xf(m.v[a]), B = xf(m.v[b]), C = xf(m.v[c]);
      const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], v = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
      const nn = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      for (const P of [A, B, C]) { pos.set(P, o); nor.set(nn, o); o += 3; }
    }
    const bp = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bp); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
    const bn = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bn); gl.bufferData(gl.ARRAY_BUFFER, nor, gl.STATIC_DRAW);
    return { bp, bn, count: m.f.length * 3 };
  };
  function show(rotor, nose, r) {
    for (const q of parts) { gl.deleteBuffer(q.bp); gl.deleteBuffer(q.bn); }
    const bb = KATAK.bounds(rotor);
    centre = bb.lo.map((x, i) => (x + bb.hi[i]) / 2); radius = Math.max(...bb.size) * 0.75;
    parts = [{ ...upload(rotor, (p) => p), col: [1.0, 0.10, 0.55] }];
    if (nose) {
      const zFront = r.lift_mm - r.params.hub_front_mm;          // the hub's front end, where the nose cup sits
      parts.push({ ...upload(nose, (p) => [p[0], p[1], zFront - p[2] + r.params.hub_front_mm * 0.9]), col: [0.95, 0.85, 0.92] });
    }
    draw();
  }
  function mat4mul(a, b) { const o = new Float32Array(16); for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; o[i * 4 + j] = s; } return o; }
  function draw() {
    const w = cv.clientWidth * devicePixelRatio, h = cv.clientHeight * devicePixelRatio;
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
    gl.useProgram(prog);
    const dist = radius * 3 * zoom;
    const eye = [centre[0] + dist * Math.cos(pitch) * Math.cos(yaw), centre[1] + dist * Math.cos(pitch) * Math.sin(yaw), centre[2] + dist * Math.sin(pitch)];
    const f = [centre[0] - eye[0], centre[1] - eye[1], centre[2] - eye[2]]; const fl = Math.hypot(...f); f.forEach((x, i) => (f[i] = x / fl));
    let s = [f[1] * 1 - f[2] * 0, f[2] * 0 - f[0] * 1, 0]; const sl = Math.hypot(...s) || 1; s = s.map((x) => x / sl);
    const u = [s[1] * f[2] - s[2] * f[1], s[2] * f[0] - s[0] * f[2], s[0] * f[1] - s[1] * f[0]];
    const view = new Float32Array([s[0], u[0], -f[0], 0, s[1], u[1], -f[1], 0, s[2], u[2], -f[2], 0,
      -(s[0] * eye[0] + s[1] * eye[1] + s[2] * eye[2]), -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]), f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2], 1]);
    const asp = w / h, fov = 0.6, near = dist * 0.05, far = dist * 4, t = 1 / Math.tan(fov / 2);
    const proj = new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, 2 * far * near / (near - far), 0]);
    gl.uniformMatrix4fv(loc.mvp, false, mat4mul(proj, view));
    gl.uniformMatrix3fv(loc.nm, false, new Float32Array([view[0], view[1], view[2], view[4], view[5], view[6], view[8], view[9], view[10]]));
    for (const q of parts) {
      gl.uniform3fv(loc.col, q.col);
      gl.bindBuffer(gl.ARRAY_BUFFER, q.bp); gl.enableVertexAttribArray(loc.p); gl.vertexAttribPointer(loc.p, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, q.bn); gl.enableVertexAttribArray(loc.n); gl.vertexAttribPointer(loc.n, 3, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, q.count);
    }
  }
  let drag = null;
  cv.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.01; pitch = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - drag[1]) * 0.01)); drag = [e.clientX, e.clientY]; draw(); });
  cv.addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.max(0.3, Math.min(3, zoom * (e.deltaY > 0 ? 1.1 : 0.9))); draw(); }, { passive: false });
  addEventListener('resize', draw);
  return { show };
})();

// ---- start
$('#lang-select').value = lang;
$('#lang-select').addEventListener('change', (e) => { lang = e.target.value; try { localStorage.setItem('katak-lang', lang); } catch { /* private mode */ } applyI18n(); render(); });
$('#dl-rotor').addEventListener('click', () => download('rotor'));
$('#dl-nose').addEventListener('click', () => download('nose'));
applyI18n();
compute();
window.KATAK_PAGE = { compute, state: () => last };   // for tools/ui-run.mjs
</script>
